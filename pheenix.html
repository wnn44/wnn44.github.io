<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PHEENIX — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    background: radial-gradient(ellipse at top, #0b0d1f, #05060f 75%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color:#e6f7ff;
    user-select:none;
  }
  header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 16px;
    background: rgba(13,17,40,0.85);
    backdrop-filter: blur(8px);
    border-bottom:1px solid rgba(0,240,255,0.25);
    box-shadow: 0 0 20px rgba(0,240,255,0.15);
  }
  .logo {
    font-weight:800; font-size:clamp(1rem,3vw,1.4rem);
    color:#00f0ff;
    text-shadow: 0 0 10px #00f0ff, 0 0 25px #00f0ff55;
    letter-spacing:2px;
  }
  .header-right { display:flex; gap:8px; align-items:center; }
  .chip {
    padding:5px 12px; border-radius:20px; font-size:clamp(0.7rem,2vw,0.85rem);
    font-weight:600; cursor:pointer; transition:0.2s;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .chip.lb { background:rgba(255,233,77,0.15); color:#ffe94d; border-color:#ffe94d; box-shadow:0 0 10px #ffe94d33; }
  .chip.lb:active { background:#ffe94d; color:#05060f; }
  .chip.user { background:rgba(0,240,255,0.1); color:#00f0ff; border-color:#00f0ff55; }
  .chip.menu { background:rgba(255,0,212,0.15); color:#ff00d4; border-color:#ff00d455; box-shadow:0 0 10px #ff00d433; }
  .chip.menu:active { background:#ff00d4; color:#05060f; }

  #gameWrap {
    position:fixed; top:52px; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    padding:8px;
  }
  canvas {
    display:block;
    border-radius:12px;
    border:1px solid rgba(0,240,255,0.3);
    box-shadow: 0 0 30px rgba(0,240,255,0.2), inset 0 0 40px rgba(0,0,0,0.5);
    background:#05060f;
    touch-action:none;
  }

  .hud {
    position:fixed; top:60px; left:16px; right:16px; z-index:50;
    display:flex; justify-content:space-between;
    pointer-events:none;
    font-weight:700; font-size:clamp(0.75rem,2.5vw,1rem);
    text-shadow:0 0 8px currentColor;
  }
  .hud .score { color:#00ff88; }
  .hud .lives { color:#ff3355; }
  .hud .level { color:#a855ff; }

  .mobile-controls {
    position:fixed; bottom:0; left:0; right:0; z-index:80;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:12px 16px 20px;
    pointer-events:none;
  }
  .mobile-controls .dpad { display:flex; gap:12px; pointer-events:auto; }
  .mobile-controls .actions { display:flex; gap:12px; pointer-events:auto; }
  .tbtn {
    width:60px; height:60px; border-radius:50%;
    background:rgba(13,17,40,0.8);
    border:2px solid #00f0ff;
    color:#00f0ff; font-size:1.6rem; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 15px #00f0ff55;
    touch-action:none; user-select:none;
    transition:0.1s;
  }
  .tbtn:active { background:rgba(0,240,255,0.3); transform:scale(0.92); }
  .tbtn.fire { border-color:#ff00d4; color:#ff00d4; box-shadow:0 0 15px #ff00d455; }
  .tbtn.shield { border-color:#ffe94d; color:#ffe94d; box-shadow:0 0 15px #ffe94d55; font-size:1.2rem; }
  @media (pointer:coarse) { .mobile-controls { display:flex; } }

  #lbModalContainer { position:fixed; inset:0; z-index:200; display:none; }
  #lbModalContainer.open { display:block; }
  .mute-btn {
    position:fixed; top:60px; right:16px; z-index:110;
    background:rgba(13,17,40,0.8); border:1px solid #00f0ff55;
    color:#00f0ff; border-radius:50%; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem;
    box-shadow:0 0 10px #00f0ff33;
  }
  #err {
    position:fixed; bottom:8px; left:8px; right:8px; z-index:300;
    color:#ff5c6a; font-size:11px; font-family:monospace;
    text-align:center; display:none; pointer-events:none;
    text-shadow:0 0 6px #ff3355;
  }
</style>
</head>
<body>

<header>
  <div class="logo">PHEENIX</div>
  <div class="header-right">
    <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
    <div class="chip user" id="userChip">ГОСТЬ</div>
    <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
  </div>
</header>

<div class="hud">
  <div class="score" id="hudScore">0</div>
  <div class="level" id="hudLevel">УР. 1</div>
  <div class="lives" id="hudLives">❤❤❤❤</div>
</div>

<button class="mute-btn" id="muteBtn" type="button">🔊</button>

<div id="gameWrap"><canvas id="game"></canvas></div>

<div class="mobile-controls">
  <div class="dpad">
    <div class="tbtn" id="btnLeft">◀</div>
    <div class="tbtn" id="btnRight">▶</div>
  </div>
  <div class="actions">
    <div class="tbtn shield" id="btnShield">🛡</div>
    <div class="tbtn fire" id="btnFire">🔥</div>
  </div>
</div>

<div id="lbModalContainer"></div>
<div id="err"></div>

<script>
(function () {
'use strict';

/* ============================================================
   0. УТИЛИТЫ
   ============================================================ */
function showErr(msg) {
  const el = document.getElementById('err');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  console.error('[PHEENIX]', msg);
}

/* ============================================================
   1. ЗВУК
   ============================================================ */
let audioCtx = null;
let soundEnabled = true;
const muteBtn = document.getElementById('muteBtn');
if (muteBtn) {
  muteBtn.addEventListener('click', function () {
    soundEnabled = !soundEnabled;
    muteBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });
}
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type, vol) {
  if (!soundEnabled) return;
  type = type || 'square'; vol = vol == null ? 0.08 : vol;
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}
function sfxShoot()      { playTone(880, 0.07, 'square', 0.05); }
function sfxHit()        { playTone(220, 0.10, 'sawtooth', 0.07); }
function sfxExplosion()  { playTone(80, 0.28, 'sawtooth', 0.10); playTone(120, 0.18, 'square', 0.07); }
function sfxShield()     { playTone(440, 0.12, 'sine', 0.09); playTone(660, 0.12, 'sine', 0.07); }
function sfxLevelUp()    { playTone(523,0.10,'square',0.07); setTimeout(function(){playTone(659,0.10,'square',0.07);},110); setTimeout(function(){playTone(784,0.18,'square',0.09);},220); }
function sfxGameOver()   { playTone(300,0.35,'sawtooth',0.10); setTimeout(function(){playTone(150,0.55,'sawtooth',0.10);},350); }

/* ============================================================
   2. CANVAS
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 480, H = 720;

function resize() {
  const wrap = document.getElementById('gameWrap');
  const availW = (wrap.clientWidth  || window.innerWidth)  - 16;
  const availH = (wrap.clientHeight || (window.innerHeight - 52)) - 16;
  const ratio = 2 / 3;
  if (availW / availH > ratio) { H = availH; W = H * ratio; }
  else                         { W = availW; H = W / ratio; }
  W = Math.max(240, Math.floor(W));
  H = Math.max(360, Math.floor(H));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 100); });

/* ============================================================
   3. СОСТОЯНИЕ
   ============================================================ */
let state = 'menu';
let score = 0;
let lives = 4;
let level = 1;
let cycle = 0;
let speedMult = 1;

const player = {
  x: W/2, y: H - 60, w: 28, h: 20,
  speed: 320,
  shieldActive: false, shieldTimer: 0, shieldCooldown: 0,
  canShoot: true, shootCooldown: 0
};

let bullets = [];
let enemies = [];
let enemyBullets = [];
let particles = [];
let stars = [];

/* ============================================================
   4. ВВОД
   ============================================================ */
const keys = {};
window.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
  if (e.code === 'Escape') { try { window.location.href = 'index.html'; } catch(_){} }
  if (state === 'menu') startGame();
  if (state === 'gameover' && e.code === 'Space') startGame();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });

const touchState = { left:false, right:false, fire:false, shield:false };
function bindTouch(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  function on(e){ e.preventDefault(); touchState[key] = true; }
  function off(e){ e.preventDefault(); touchState[key] = false; }
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch('btnLeft','left');
bindTouch('btnRight','right');
bindTouch('btnFire','fire');
bindTouch('btnShield','shield');

canvas.addEventListener('touchstart', function(e){ e.preventDefault(); if (state !== 'playing') startGame(); }, {passive:false});
canvas.addEventListener('click', function(){ if (state !== 'playing') startGame(); });

/* ============================================================
   5. ЗВЁЗДЫ
   ============================================================ */
function initStars() {
  stars = [];
  for (let i = 0; i < 70; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3,
      speed: Math.random() * 30 + 8,
      brightness: Math.random() * 0.7 + 0.3
    });
  }
}

/* ============================================================
   6. ФАБРИКИ
   ============================================================ */
function createBird(x, y, type) {
  const hp = type === 'big' ? 3 : 1;
  return {
    type:'bird', x:x, y:y,
    w: type === 'big' ? 34 : 22,
    h: type === 'big' ? 24 : 16,
    hp:hp, maxHp:hp, alive:true,
    vx:0, vy:0, dive:false, diveTimer:0,
    points: type === 'big' ? 150 : 50,
    color: type === 'big' ? '#a855ff' : (Math.random() < 0.5 ? '#00f0ff' : '#ff00d4')
  };
}
function createEgg(x, y) {
  return { type:'egg', x:x, y:y, w:18, h:22, hp:1, alive:true,
           hatchTimer: 1.8 + Math.random()*1.2, points:80, color:'#ffe94d' };
}
function createMothership() {
  return {
    type:'mothership', x:W/2, y:70, w:160, h:80,
    hp:40, maxHp:40, alive:true,
    plates:5, plateHp:8, pilotHp:12,
    vx:50, points:5000, color:'#ff3355'
  };
}

/* ============================================================
   7. ГЕНЕРАЦИЯ УРОВНЯ
   ============================================================ */
function buildLevel(lv) {
  enemies = []; enemyBullets = []; bullets = []; particles = [];
  const effLv = ((lv - 1) % 5) + 1;

  if (effLv === 1 || effLv === 2) {
    const cols = 8;
    const rows = effLv === 1 ? 2 : 3;
    const startX = W/2 - (cols - 1) * 30 / 2;
    const startY = 90;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push(createBird(startX + c * 30, startY + r * 34, 'small'));
      }
    }
  } else if (effLv === 3 || effLv === 4) {
    const count = effLv === 3 ? 8 : 12;
    for (let i = 0; i < count; i++) {
      enemies.push(createEgg(50 + Math.random() * (W - 100), 80 + Math.random() * 140));
    }
  } else if (effLv === 5) {
    enemies.push(createMothership());
    for (let i = 0; i < 6; i++) {
      const b = createBird(60 + i * 70, 30, 'small');
      b.color = '#ff5c6a';
      enemies.push(b);
    }
  }

  speedMult = 1 + cycle * 0.25 + (lv - 1) * 0.05;
  player.x = W/2;
  player.y = H - 60;
  player.shieldActive = false;
  player.shieldTimer = 0;
  player.shieldCooldown = 0;
  player.canShoot = true;
  updateHUD();
}

/* ============================================================
   8. ЛОГИКА
   ============================================================ */
function shoot() {
  if (!player.canShoot || player.shootCooldown > 0) return;
  bullets.push({ x:player.x, y:player.y - player.h/2 - 4, vy:-520, w:3, h:12, alive:true });
  player.shootCooldown = 0.16;
  sfxShoot();
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 160;
    particles.push({
      x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:0.4 + Math.random()*0.5, maxLife:0.9,
      color:color, size:2 + Math.random()*3
    });
  }
}

function playerHit() {
  if (player.shieldActive) return;
  lives--;
  sfxExplosion();
  createParticles(player.x, player.y, '#ff3355', 20);
  if (lives <= 0) {
    state = 'gameover';
    sfxGameOver();
    try { submitScore(score); } catch (e) { showErr('submitScore: ' + e.message); }
  } else {
    player.shieldActive = true;
    player.shieldTimer = 1.5;
    player.canShoot = false;
    player.shieldCooldown = 0;
  }
  updateHUD();
}

function update(dt) {
  // Звёзды двигаются всегда — чтобы даже в меню было видно, что игра живая
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.y += s.speed * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
  // Частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt; p.vy += 100 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (state !== 'playing') return;

  // Игрок
  let moveX = 0;
  if (keys['ArrowLeft']  || keys['KeyA'] || touchState.left)  moveX -= 1;
  if (keys['ArrowRight'] || keys['KeyD'] || touchState.right) moveX += 1;
  player.x += moveX * player.speed * dt;
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

  // Щит
  if (player.shieldActive) {
    player.shieldTimer -= dt;
    if (player.shieldTimer <= 0) {
      player.shieldActive = false;
      player.canShoot = true;
      player.shieldCooldown = 5;
    }
  } else {
    if (player.shieldCooldown > 0) player.shieldCooldown -= dt;
    const wantShield = keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyS'] || touchState.shield;
    if (wantShield && player.shieldCooldown <= 0) {
      player.shieldActive = true;
      player.shieldTimer = 3;
      player.canShoot = false;
      sfxShield();
    }
  }

  // Стрельба
  if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || touchState.fire) && player.canShoot) shoot();
  if (player.shootCooldown > 0) player.shootCooldown -= dt;

  // Пули игрока
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy * dt;
    if (b.y < -20) bullets.splice(i, 1);
  }

  // Враги
  let anyAlive = false;
  let mothershipAlive = false;
  let otherAlive = false;

  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive) continue;
    anyAlive = true;
    if (e.type === 'mothership') mothershipAlive = true;
    else otherAlive = true;

    if (e.type === 'bird') {
      if (!e.dive) {
        e.x += Math.sin(performance.now() * 0.001 + e.y) * 20 * dt * speedMult;
        if (Math.random() < 0.002 * speedMult) {
          e.dive = true;
          e.diveTimer = 2 + Math.random() * 2;
          e.vx = (player.x - e.x) * 0.6;
          e.vy = 100 * speedMult;
        }
      } else {
        e.diveTimer -= dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.y > H + 30 || e.diveTimer <= 0) {
          e.dive = false;
          e.y = 60;
          e.x = 60 + Math.random() * (W - 120);
          e.vy = 0;
        }
      }
      if (Math.random() < 0.003 * speedMult) {
        enemyBullets.push({ x:e.x, y:e.y + 10, vy:120 * speedMult, alive:true, w:3, h:8 });
      }
    } else if (e.type === 'egg') {
      e.x += Math.sin(performance.now() * 0.002 + e.y) * 60 * dt;
      e.x = Math.max(20, Math.min(W - 20, e.x));
      e.hatchTimer -= dt;
      if (e.hatchTimer <= 0) {
        e.alive = false;
        const b = createBird(e.x, e.y, Math.random() < 0.4 ? 'big' : 'small');
        b.color = '#ff00d4';
        enemies.push(b);
      }
    } else if (e.type === 'mothership') {
      e.x += e.vx * dt;
      if (e.x < W/2 - 60 || e.x > W/2 + 60) e.vx *= -1;
      if (Math.random() < 0.02 * speedMult) {
        enemyBullets.push({ x:e.x + (Math.random()-0.5)*e.w, y:e.y + e.h/2, vy:140*speedMult, alive:true, w:4, h:10 });
      }
    }
  }

  // Пули врагов
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.y += b.vy * dt;
    if (b.y > H + 20) { enemyBullets.splice(i, 1); continue; }
    if (!player.shieldActive &&
        Math.abs(b.x - player.x) < player.w/2 + 3 &&
        Math.abs(b.y - player.y) < player.h/2 + 5) {
      enemyBullets.splice(i, 1);
      playerHit();
    }
  }

  // Пули игрока vs враги
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let consumed = false;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (!e.alive) continue;
      if (Math.abs(b.x - e.x) < e.w/2 + 3 && Math.abs(b.y - e.y) < e.h/2 + 6) {
        consumed = true;
        // Материнский корабль: сначала пластины, потом корпус
        if (e.type === 'mothership') {
          if (e.plateHp > 0) {
            e.plateHp--;
            if (e.plateHp <= 0 && e.plates > 0) e.plates--;
            createParticles(e.x + (Math.random()-0.5)*e.w, e.y - 4, '#ffe94d', 4);
            if (e.plates <= 0 && e.plateHp <= 0) e.hp = e.pilotHp;
          } else {
            e.hp--;
          }
          if (e.hp <= 0) {
            e.alive = false;
            score += e.points * (1 + cycle);
            sfxExplosion();
            createParticles(e.x, e.y, e.color, 30);
          } else {
            sfxHit();
          }
        } else {
          e.hp--;
          createParticles(e.x, e.y, e.color, 5);
          if (e.hp <= 0) {
            e.alive = false;
            score += e.points * (1 + cycle);
            sfxExplosion();
            createParticles(e.x, e.y, e.color, 12);
          } else {
            sfxHit();
          }
        }
        break;
      }
    }
    if (consumed) bullets.splice(i, 1);
  }

  // Столкновение игрока с врагом (без щита)
  if (!player.shieldActive) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      if (Math.abs(e.x - player.x) < (e.w + player.w)/2 - 4 &&
          Math.abs(e.y - player.y) < (e.h + player.h)/2 - 4) {
        e.alive = false;
        createParticles(e.x, e.y, '#ff3355', 10);
        playerHit();
        break;
      }
    }
  }

  // Проверка завершения уровня
  const ms = enemies.find(function(x){ return x.alive && x.type === 'mothership'; });
  const others = enemies.filter(function(x){ return x.alive && x.type !== 'mothership'; });
  const done = (!ms && others.length === 0);
  if (done && state === 'playing') {
    state = 'levelclear';
    sfxLevelUp();
    setTimeout(function(){
      level++;
      cycle = Math.floor((level - 1) / 5);
      buildLevel(level);
      state = 'playing';
      updateHUD();
    }, 1500);
  }

  updateHUD();
}

/* ============================================================
   9. ОТРИСОВКА
   ============================================================ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H * 0.8);
  grad.addColorStop(0, '#0b0d1f');
  grad.addColorStop(1, '#05060f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Звёзды
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    ctx.globalAlpha = s.brightness;
    ctx.fillStyle = '#e6f7ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Частицы
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Враги
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive) continue;
    ctx.shadowColor = e.color; ctx.shadowBlur = 12;
    ctx.fillStyle = e.color;

    if (e.type === 'bird') {
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - e.h/2);
      ctx.lineTo(e.x - e.w/2, e.y + e.h/2);
      ctx.lineTo(e.x, e.y + e.h/4);
      ctx.lineTo(e.x + e.w/2, e.y + e.h/2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(e.x - e.w/2, e.y, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y, 5, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.type === 'egg') {
      ctx.beginPath();
      ctx.ellipse(e.x, e.y, e.w/2, e.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#05060f';
      ctx.beginPath(); ctx.arc(e.x-4, e.y-4, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+4, e.y-4, 2, 0, Math.PI*2); ctx.fill();
    } else if (e.type === 'mothership') {
      ctx.fillStyle = '#330033';
      ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, 6);
      ctx.fillRect(e.x - e.w/2, e.y + e.h/2 - 6, e.w, 6);
      const plateW = e.w / 5;
      const platesShown = Math.max(0, Math.ceil(e.plateHp));
      for (let k = 0; k < platesShown; k++) {
        ctx.fillStyle = '#ffe94d';
        ctx.fillRect(e.x - e.w/2 + k*plateW + 2, e.y - 4, plateW - 4, 8);
      }
      ctx.fillStyle = '#ff00d4';
      ctx.beginPath(); ctx.arc(e.x, e.y + 10, 12, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  // Пули игрока
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#00f0ff';
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }

  // Пули врагов
  ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff3355';
  for (let i = 0; i < enemyBullets.length; i++) {
    const b = enemyBullets[i];
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }
  ctx.shadowBlur = 0;

  // Игрок
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - player.h/2);
  ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
  ctx.lineTo(player.x, player.y + player.h/4);
  ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(player.x, player.y - 2, 4, 0, Math.PI*2); ctx.fill();

  // Щит
  if (player.shieldActive) {
    ctx.strokeStyle = '#ffe94d'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffe94d'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.2 + Math.sin(performance.now()*0.01)*0.1;
    ctx.fillStyle = '#ffe94d';
    ctx.beginPath(); ctx.arc(player.x, player.y, 24, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;

  // Стартовый экран
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(5,6,15,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff00d4'; ctx.shadowBlur = 25;
    ctx.fillStyle = '#ff00d4';
    ctx.font = 'bold 42px sans-serif';
    ctx.fillText('PHEENIX', W/2, H/2 - 60);
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 15;
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('НАЖМИ ПРОБЕЛ ИЛИ ТАПНИ', W/2, H/2 + 10);
    ctx.fillStyle = '#e6f7ff';
    ctx.font = '13px sans-serif';
    ctx.shadowBlur = 6;
    ctx.fillText('← → / A D — движение', W/2, H/2 + 60);
    ctx.fillText('SPACE / W — огонь', W/2, H/2 + 84);
    ctx.fillText('SHIFT / S — щит', W/2, H/2 + 108);
    ctx.shadowBlur = 0;
  }

  // Уровень пройден
  if (state === 'levelclear') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 24px sans-serif';
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
    ctx.fillText('УРОВЕНЬ ' + ((((level-1) % 5) + 1)) + ' ПРОЙДЕН!', W/2, H/2);
    ctx.shadowBlur = 0;
  }

  // Игра окончена
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(5,6,15,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3355'; ctx.font = 'bold 30px sans-serif';
    ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 25;
    ctx.fillText('ИГРА ОКОНЧЕНА', W/2, H/2 - 30);
    ctx.fillStyle = '#ffe94d'; ctx.font = 'bold 20px sans-serif';
    ctx.shadowColor = '#ffe94d'; ctx.shadowBlur = 18;
    ctx.fillText('СЧЁТ: ' + score, W/2, H/2 + 10);
    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 15px sans-serif';
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
    ctx.fillText('ПРОБЕЛ / ТАП — ЗАНОВО', W/2, H/2 + 60);
    ctx.shadowBlur = 0;
  }
}

/* ============================================================
   10. HUD
   ============================================================ */
function updateHUD() {
  const s = document.getElementById('hudScore');
  const l = document.getElementById('hudLevel');
  const v = document.getElementById('hudLives');
  if (s) s.textContent = score;
  if (l) l.textContent = 'УР. ' + ((((level-1) % 5) + 1));
  if (v) v.textContent = new Array(Math.max(0, lives) + 1).join('❤');
}

/* ============================================================
   11. СТАРТ / СБРОС
   ============================================================ */
function startGame() {
  score = 0; lives = 4; level = 1; cycle = 0;
  player.shieldActive = false; player.shieldTimer = 0; player.shieldCooldown = 0;
  player.canShoot = true;
  bullets = []; enemyBullets = []; particles = [];
  buildLevel(1);
  state = 'playing';
  updateHUD();
  initAudio();
}

/* ============================================================
   12. ИГРОВОЙ ЦИКЛ
   ============================================================ */
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000 || 0.016);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   13. ПЛАТФОРМА (в try/catch — не должна ломать игру)
   ============================================================ */
let currentPlayer = null;
try {
  if (typeof Auth !== 'undefined' && Auth && typeof Auth.get === 'function') {
    currentPlayer = Auth.get();
  }
} catch (e) { showErr('Auth: ' + e.message); }

try {
  if (userChip) userChip.textContent = currentPlayer ? ('👤 ' + currentPlayer) : 'ГОСТЬ';
} catch (e) {}

function loadStats() {
  try {
    if (typeof Leaderboard !== 'undefined' && Leaderboard) {
      if (typeof Leaderboard.getPlayerBest === 'function') {
        void Leaderboard.getPlayerBest('pheenix', currentPlayer);
      }
      if (typeof Leaderboard.getGlobalRecord === 'function') {
        void Leaderboard.getGlobalRecord('pheenix');
      }
    }
  } catch (e) { showErr('loadStats: ' + e.message); }
}

async function submitScore(finalScore) {
  try {
    if (currentPlayer && finalScore > 0 &&
        typeof Leaderboard !== 'undefined' && Leaderboard &&
        typeof Leaderboard.submit === 'function') {
      await Leaderboard.submit('pheenix', currentPlayer, finalScore);
      loadStats();
    }
  } catch (e) { showErr('submit: ' + e.message); }
}

window.addEventListener('leaderboard-updated', loadStats);

/* ============================================================
   14. UI-КНОПКИ ШАПКИ
   ============================================================ */
const userChip = document.getElementById('userChip');
document.getElementById('lbHeaderBtn')?.addEventListener('click', function () {
  try {
    if (typeof LeaderboardUI !== 'undefined' && LeaderboardUI && typeof LeaderboardUI.open === 'function') {
      LeaderboardUI.open('pheenix');
    }
  } catch (e) { showErr('LB UI: ' + e.message); }
});
document.getElementById('menuBtn')?.addEventListener('click', function () {
  try { window.location.href = 'index.html'; } catch (_) {}
});

/* ============================================================
   15. ЗАПУСК
   ============================================================ */
resize();
initStars();
buildLevel(1);
state = 'menu';
updateHUD();
requestAnimationFrame(loop);
loadStats();

})();
</script>
</body>
