<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON MATCH — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<style>
:root{
  --cyan:#00f0ff; --magenta:#ff00d4; --violet:#a855ff;
  --yellow:#ffe94d; --green:#00ff88; --red:#ff3355;
  --bg-1:#0b0d1f; --bg-2:#05060f; --panel:rgba(13,17,40,.85);
  --text:#e6f7ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top, var(--bg-1), var(--bg-2) 75%),
    #05060f;
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
/* ====== HEADER ====== */
header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px clamp(10px,2vw,22px);
  background:linear-gradient(180deg,rgba(5,6,15,.95),rgba(5,6,15,.7));
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,240,255,.15);
}
.logo{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(16px,2.4vw,22px);
  letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(0,240,255,.3);
}
.header-right{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 12px;border-radius:999px;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);border:1px solid rgba(255,255,255,.08);
  transition:all .2s;white-space:nowrap;
}
.chip:hover{transform:translateY(-1px)}
.chip.lb{color:var(--yellow);border-color:rgba(255,233,77,.3);box-shadow:0 0 12px rgba(255,233,77,.15)}
.chip.user{color:var(--green);border-color:rgba(77,238,138,.3)}
.chip.menu{color:var(--cyan);border-color:rgba(0,240,255,.3);box-shadow:0 0 12px rgba(0,240,255,.15)}

/* ====== LAYOUT ====== */
.page{
  flex:1;display:grid;
  grid-template-columns:minmax(0,620px) 320px;
  gap:clamp(12px,2vw,22px);
  padding:clamp(10px,2vw,22px);
  max-width:1200px;margin:0 auto;width:100%;
  justify-content:center;align-items:start;
}
@media(max-width:900px){
  .page{grid-template-columns:1fr}
}

/* ====== BOARD ====== */
.board-card{
  position:relative;width:100%;padding:12px;border-radius:18px;
  background:var(--panel);
  border:1px solid rgba(0,240,255,.2);
  box-shadow:
    0 0 30px rgba(0,240,255,.08),
    inset 0 0 20px rgba(0,240,255,.04);
}
.board-wrap{position:relative}
canvas{
  display:block;width:100%;border-radius:10px;
  touch-action:none;cursor:pointer;
  background:
    radial-gradient(ellipse at center, rgba(168,85,255,.08), transparent 70%),
    linear-gradient(180deg,rgba(13,17,40,.6),rgba(5,6,15,.85));
}
#comboToast{
  position:absolute;left:50%;top:40%;
  transform:translate(-50%,-50%);
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(24px,6vw,44px);
  color:var(--yellow);
  text-shadow:0 0 24px var(--yellow),0 0 48px rgba(255,233,77,.6);
  opacity:0;pointer-events:none;white-space:nowrap;
  letter-spacing:.1em;
}
#comboToast.show{animation:comboPop 1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-5deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(2deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-75%) scale(1.1)}}
#toast{
  position:absolute;left:50%;bottom:10px;
  transform:translateX(-50%) translateY(10px);
  background:var(--panel);border:1px solid rgba(255,51,85,.4);
  padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;
  color:var(--red);text-shadow:0 0 6px rgba(255,51,85,.4);
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ====== SIDE ====== */
.side{display:flex;flex-direction:column;gap:12px}
.card{
  padding:14px 16px;border-radius:14px;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 10px 28px rgba(0,0,0,.4);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,transparent 60%,rgba(0,240,255,.06));
}
.label{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(230,247,255,.6);font-weight:800;
}
.big{
  display:inline-block;
  font-family:'Orbitron',sans-serif;font-weight:800;
  font-size:clamp(26px,5vw,34px);line-height:1.15;margin-top:2px;
}
#score{
  color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.55);
  font-variant-numeric:tabular-nums;
}
.best-line{margin-top:6px;font-size:12px;font-weight:700;color:rgba(230,247,255,.6)}
.best-line b{color:var(--yellow);text-shadow:0 0 8px rgba(255,233,77,.5)}
.row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.level-chip{
  font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;
  color:#1a0a2e;letter-spacing:.1em;
  background:linear-gradient(135deg,var(--magenta),var(--violet));
  padding:4px 12px;border-radius:8px;
  box-shadow:0 0 14px rgba(168,85,255,.5);
}
.bar{
  height:10px;border-radius:999px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--magenta),var(--cyan));
  transition:width .5s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 0 10px rgba(0,240,255,.5);
}
.prog-label{margin-top:7px;font-size:11px;font-weight:700;color:rgba(230,247,255,.6)}
#movesCard.danger #moves{color:var(--red);animation:pulse .8s ease-in-out infinite;text-shadow:0 0 14px rgba(255,51,85,.6)}
@keyframes pulse{50%{opacity:.5}}
.btns{display:flex;flex-direction:column;gap:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  cursor:pointer;border:none;width:100%;
  font-family:'Rajdhani',sans-serif;font-weight:800;font-size:14px;letter-spacing:.1em;
  padding:12px 16px;border-radius:10px;
  text-transform:uppercase;transition:all .2s;
  touch-action:manipulation;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),var(--magenta));
  color:#0a0f25;
  box-shadow:0 0 18px rgba(0,240,255,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-ghost{
  background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid rgba(0,240,255,.25);
}
.btn-ghost:hover{background:rgba(0,240,255,.08);box-shadow:0 0 12px rgba(0,240,255,.2)}
.help{font-size:12px;line-height:1.6;color:rgba(230,247,255,.65);padding:0 2px}
@media(max-width:900px){
  .side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .span2{grid-column:1/-1}
}
@media(max-width:520px){
  .side{grid-template-columns:1fr}
}

/* ====== OVERLAY ====== */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;
  background:rgba(5,6,15,.78);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{
  width:min(90vw,440px);text-align:center;
  padding:clamp(24px,4vw,38px) clamp(20px,4vw,40px);
  border-radius:20px;
  background:var(--panel);
  border:1px solid rgba(0,240,255,.3);
  box-shadow:0 0 40px rgba(0,240,255,.15),0 0 80px rgba(255,0,212,.1);
  transform:scale(.85) translateY(18px);
  transition:transform .35s cubic-bezier(.2,1.3,.3,1);
}
.overlay.show .overlay-card{transform:none}
.ov-emoji{font-size:56px;margin-bottom:8px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ov-title{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(20px,3.6vw,26px);margin-bottom:12px;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ov-text{color:rgba(230,247,255,.8);line-height:1.6;margin-bottom:22px;font-size:14px}
.ov-text b{color:var(--yellow);text-shadow:0 0 6px rgba(255,233,77,.4)}
</style>
</head>
<body>

<header>
  <div class="logo">NEON MATCH</div>
  <div class="header-right">
    <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
    <div class="chip user" id="userChip">ГОСТЬ</div>
    <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
  </div>
</header>

<main class="page">
  <section class="board-card">
    <div class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>
      <div id="comboToast"></div>
      <div id="toast"></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="label">Счёт</div>
      <div class="big" id="score">0</div>
      <div class="best-line">🏆 Рекорд: <b id="best">0</b></div>
    </div>
    <div class="card span2">
      <div class="row-between">
        <span class="label">Уровень</span>
        <span class="level-chip" id="level">1</span>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="prog-label" id="progLabel"></div>
    </div>
    <div class="card" id="movesCard">
      <div class="label">Осталось ходов</div>
      <div class="big" id="moves">25</div>
    </div>
    <div class="btns span2">
      <button class="btn btn-primary" id="newBtn">⚡ Новая игра</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="hintBtn">💡 Подсказка · 3</button>
        <button class="btn btn-ghost" id="soundBtn">🔊 Звук</button>
      </div>
    </div>
    <p class="help span2">
      Кликните по двум соседним кристаллам, чтобы поменять их местами. Собирайте линии из 3+ одинаковых символов.
      Каскадные комбо дают множитель очков. Управление: мышь / свайп / клавиатура.
    </p>
  </aside>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="ov-emoji" id="ovEmoji">⚡</div>
    <h2 class="ov-title" id="ovTitle"></h2>
    <p class="ov-text" id="ovText"></p>
    <button class="btn btn-primary" id="ovBtn">Продолжить</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';

/* ═══════════ ПЛАТФОРМА ═══════════ */
const GAME_ID = 'neon_match';
const currentPlayer = (typeof Auth !== 'undefined' ? Auth.get() : null);
const userChip = document.getElementById('userChip');
if (userChip) userChip.textContent = currentPlayer ? `👤 ${currentPlayer}` : 'ГОСТЬ';

document.getElementById('lbHeaderBtn')?.addEventListener('click', () => {
  if (typeof LeaderboardUI !== 'undefined') LeaderboardUI.open(GAME_ID);
});
document.getElementById('menuBtn')?.addEventListener('click', () => {
  window.location.href = 'index.html';
});

async function loadStats() {
  try {
    if (typeof Leaderboard === 'undefined') return;
    const [myBest, globalRec] = await Promise.all([
      Leaderboard.getPlayerBest(GAME_ID, currentPlayer),
      Leaderboard.getGlobalRecord(GAME_ID)
    ]);
    if (myBest > best) { best = myBest; bestEl.textContent = best; }
    if (globalRec && globalRec.score > best) {
      best = globalRec.score; bestEl.textContent = best;
    }
  } catch(e) { /* тихий фоллбек */ }
}
async function submitScore(finalScore) {
  try {
    if (typeof Leaderboard !== 'undefined' && currentPlayer && finalScore > 0) {
      await Leaderboard.submit(GAME_ID, currentPlayer, finalScore);
      loadStats();
    }
  } catch(e){}
}

/* ═══════════ КОНСТАНТЫ ═══════════ */
const ROWS=8, COLS=8;
// Неоновая палитра
const COLORS=[
  {name:'cyan',    main:'#00f0ff', glow:'rgba(0,240,255,.8)'},
  {name:'magenta', main:'#ff00d4', glow:'rgba(255,0,212,.8)'},
  {name:'violet',  main:'#a855ff', glow:'rgba(168,85,255,.8)'},
  {name:'yellow',  main:'#ffe94d', glow:'rgba(255,233,77,.8)'},
  {name:'green',   main:'#00ff88', glow:'rgba(0,255,136,.8)'},
  {name:'red',     main:'#ff3355', glow:'rgba(255,51,85,.8)'}
];

const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=n=>Math.floor(Math.random()*n);
const need=l=>1000+(l-1)*800;

/* ═══════════ ЗВУК ═══════════ */
const sfx=(()=>{
  let ctx=null, on=true, lastLand=0;
  function ensure(){
    if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(ctx&&ctx.state==='suspended')ctx.resume();
  }
  function env(type,f0,f1,dur,vol,delay=0){
    if(!on||!ctx)return;const t=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.03);
  }
  return{
    ensure, toggle(){on=!on;return on},
    tick(){ensure();env('sine',600,800,.05,.04)},
    swap(){ensure();env('triangle',300,500,.08,.05)},
    bad(){ensure();env('sawtooth',180,100,.15,.04)},
    pop(combo){ensure();const f=320*Math.pow(1.15,combo);
      env('triangle',f,f*2,.13,.1);env('sine',f*2,f*2.8,.1,.04)},
    shuffle(){ensure();env('sine',220,620,.25,.06)},
    level(){ensure();[523,659,784,1047].forEach((f,i)=>env('triangle',f,f,.17,.08,i*.09))},
    land(){ensure();const now=performance.now();if(now-lastLand<80)return;lastLand=now;env('sine',160,90,.05,.03)}
  };
})();

/* ═══════════ СОСТОЯНИЕ ═══════════ */
const canvas=$('board'), ctx=canvas.getContext('2d'), wrap=$('boardWrap');
const scoreEl=$('score'), bestEl=$('best'), levelEl=$('level'), movesEl=$('moves'),
      fillEl=$('fill'), progEl=$('progLabel'), movesCard=$('movesCard'), hintBtn=$('hintBtn');

let size=0, cell=0, dpr=1;
let grid=[], state='idle', sel=null, hover=null, hint=null, hintUntil=0, dragInfo=null;
let score=0, displayScore=0, best=0;
let level=1, levelScore=0, movesLeft=25, hintsLeft=3;
let particles=[], floaters=[], fallResolve=null, tSec=0;

const cx=c=>c*cell+cell/2, cy=r=>r*cell+cell/2;
const makeBall=(r,c,color)=>({color,row:r,col:c,x:cx(c),y:cy(r),
  vy:0,falling:false,targetY:0,scale:1,alpha:1,squash:0});

function resize(){
  size=wrap.clientWidth;
  dpr=Math.min(2.5,window.devicePixelRatio||1);
  canvas.style.height=size+'px';
  canvas.width=Math.round(size*dpr);
  canvas.height=Math.round(size*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cell=size/COLS;
  // Сброс позиций без анимации
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=grid[r]&&grid[r][c];
    if(b&&!b.falling){b.x=cx(c);b.y=cy(r)}
  }
}

/* ═══════════ СОВПАДЕНИЯ ═══════════ */
function findRuns(){
  const runs=[];
  for(let r=0;r<ROWS;r++){
    let c=0;
    while(c<COLS){
      let e=c+1;
      while(e<COLS&&grid[r][e].color===grid[r][c].color)e++;
      if(e-c>=3){const balls=[];for(let i=c;i<e;i++)balls.push(grid[r][i]);
        runs.push({balls,color:grid[r][c].color})}
      c=e;
    }
  }
  for(let c=0;c<COLS;c++){
    let r=0;
    while(r<ROWS){
      let e=r+1;
      while(e<ROWS&&grid[e][c].color===grid[r][c].color)e++;
      if(e-r>=3){const balls=[];for(let i=r;i<e;i++)balls.push(grid[i][c]);
        runs.push({balls,color:grid[r][c].color})}
      r=e;
    }
  }
  return runs;
}
function makesMatchAt(r,c){
  const col=grid[r][c].color;
  let n=1;
  for(let i=c-1;i>=0&&grid[r][i].color===col;i--)n++;
  for(let i=c+1;i<COLS&&grid[r][i].color===col;i++)n++;
  if(n>=3)return true;
  n=1;
  for(let i=r-1;i>=0&&grid[i][c].color===col;i--)n++;
  for(let i=r+1;i<ROWS&&grid[i][c].color===col;i++)n++;
  return n>=3;
}
// ИСПРАВЛЕННАЯ генерация: гарантированно без линий из 3+, без падения
function initBoard(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      let color, attempts=0;
      do{
        color=rnd(COLORS.length);
        attempts++;
      } while(attempts<50 && wouldCreateMatch(r,c,color));
      grid[r][c]=makeBall(r,c,color);
    }
  }
  // Если всё же остались совпадения (крайне редко) — перегенерим
  if(findRuns().length)initBoard();
}
// Проверка: создаст ли цвет в (r,c) совпадение из 3+ по горизонтали/вертикали
function wouldCreateMatch(r,c,color){
  // Горизонталь: 2 слева того же цвета
  if(c>=2 && grid[r][c-1]&&grid[r][c-1].color===color && grid[r][c-2]&&grid[r][c-2].color===color)return true;
  // Вертикаль: 2 сверху того же цвета
  if(r>=2 && grid[r-1]&&grid[r-1][c]&&grid[r-1][c].color===color && grid[r-2]&&grid[r-2][c]&&grid[r-2][c].color===color)return true;
  return false;
}

function findHintPair(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const[dr,dc]of[[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
      const a=grid[r][c],b=grid[r2][c2];
      const t=a.color;a.color=b.color;b.color=t;
      const ok=makesMatchAt(r,c)||makesMatchAt(r2,c2);
      a.color=b.color;b.color=t;
      if(ok)return[a,b];
    }
  }
  return null;
}

/* ═══════════ ХОД ИГРЫ ═══════════ */
function swapCells(a,b){
  grid[a.row][a.col]=b;grid[b.row][b.col]=a;
  const r=a.row,c=a.col;a.row=b.row;a.col=b.col;b.row=r;b.col=c;
  a.x=cx(a.col);a.y=cy(a.row);b.x=cx(b.col);b.y=cy(b.row);
}
function animateSwap(a,b){
  const ax=a.x,ay=a.y,bx=b.x,by=b.y;
  return animate(170,p=>{const t=easeIO(p);
    a.x=lerp(ax,bx,t);a.y=lerp(ay,by,t);
    b.x=lerp(bx,ax,t);b.y=lerp(by,ay,t)});
}
function animate(ms,step){
  return new Promise(res=>{const t0=performance.now();
    (function fr(now){const p=Math.min(1,(now-t0)/ms);step(p);
      p<1?requestAnimationFrame(fr):res()})(t0)});
}
async function trySwap(a,b){
  if(state!=='idle'||!a||!b)return;
  state='busy';sel=null;hint=null;
  sfx.swap();
  await animateSwap(a,b);swapCells(a,b);
  if(findRuns().length){movesLeft--;updateHUD();await resolveBoard();await afterTurn();}
  else{sfx.bad();await animateSwap(a,b);swapCells(a,b);}
  if(state==='busy')state='idle';
}
async function resolveBoard(){
  let combo=0;
  while(true){
    const runs=findRuns();if(!runs.length)break;
    combo++;
    const popped=new Set();let gained=0;
    for(const run of runs){
      const base=run.balls.length*10+(run.balls.length===4?30:run.balls.length>=5?80:0);
      const pts=base*combo;
      gained+=pts;
      let mx=0,my=0;
      run.balls.forEach(b=>{mx+=b.x;my+=b.y;popped.add(b)});
      addFloater('+'+pts,mx/run.balls.length,my/run.balls.length,combo>1?'#ffe94d':'#e6f7ff');
    }
    score+=gained;levelScore+=gained;updateScore();
    if(combo>=2)showCombo(combo);
    sfx.pop(combo);
    await popBalls(popped);
    await dropAndFill();
  }
}
async function popBalls(set){
  const arr=[...set];
  arr.forEach(b=>spawnParticles(b.x,b.y,b.color));
  await animate(230,p=>{
    const s=p<.3?1+(p/.3)*.3:1.3*(1-(p-.3)/.7);
    arr.forEach(b=>{b.scale=Math.max(0,s);b.alpha=1-p*.9})});
  arr.forEach(b=>{grid[b.row][b.col]=null});
}
async function dropAndFill(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    // Сдвигаем оставшиеся вниз
    for(let r=ROWS-1;r>=0;r--){
      const b=grid[r][c];
      if(b){
        if(write!==r){grid[write][c]=b;grid[r][c]=null;b.row=write;
          b.falling=true;b.targetY=cy(write);b.vy=0;}
        write--;
      }
    }
    // Заполняем пустоты сверху новыми шариками (именно здесь и падение)
    const empties=write+1;
    for(let i=write;i>=0;i--){
      const b=makeBall(i,c,rnd(COLORS.length));
      b.y=cy(i)-empties*cell-cell*.4; // старт выше экрана
      b.falling=true;b.targetY=cy(i);b.vy=0;
      grid[i][c]=b;
    }
  }
  await new Promise(res=>fallResolve=res);
}
async function shuffleBoard(){
  toastMsg('Нет ходов — перемешиваем!');sfx.shuffle();
  const balls=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)balls.push(grid[r][c]);
  const colors=balls.map(b=>b.color);
  let guard=0;
  do{
    for(let i=colors.length-1;i>0;i--){
      const j=rnd(i+1);[colors[i],colors[j]]=[colors[j],colors[i]];
    }
    balls.forEach((b,i)=>b.color=colors[i]);
  }while((findRuns().length||!findHintPair())&&++guard<400);
  await animate(340,p=>{const s=p<.5?1-p*2:(p-.5)*2;balls.forEach(b=>b.scale=Math.max(.01,s))});
  balls.forEach(b=>b.scale=1);
}
async function afterTurn(){
  if(levelScore>=need(level)){await levelUp();return}
  if(movesLeft<=0){await gameOver();return}
  if(!findHintPair())await shuffleBoard();
}
function levelUp(){
  return new Promise(res=>{
    state='overlay';
    const excess=levelScore-need(level);
    showOverlay('⚡','УРОВЕНЬ '+level+' ПРОЙДЕН!',
      'Впереди уровень <b>'+(level+1)+'</b> · цель <b>'+need(level+1)+'</b> очков.<br>Бонус: <b>+25 ходов</b> и <b>3 подсказки</b>.',
      'Продолжить',async()=>{
        level++;levelScore=Math.max(0,excess);movesLeft+=25;hintsLeft=3;
        sfx.level();updateHUD();hideOverlay();
        if(!findHintPair())await shuffleBoard();
        state='idle';res();
      });
  });
}
async function gameOver(){
  state='overlay';
  if(score>best){best=score;bestEl.textContent=best}
  updateHUD();
  await submitScore(score);
  showOverlay('💥','ИГРА ОКОНЧЕНА',
    'Ходы закончились.<br>Ваш счёт: <b>'+score+'</b><br>Рекорд: <b>'+best+'</b>',
    'Сыграть ещё',()=>{hideOverlay();newGame()});
}
function newGame(){
  state='busy';
  score=0;displayScore=0;levelScore=0;level=1;movesLeft=25;hintsLeft=3;
  sel=null;hint=null;dragInfo=null;particles.length=0;floaters.length=0;
  scoreEl.textContent='0';
  // Генерация БЕЗ стартового падения — шарики сразу на местах
  initBoard();
  updateHUD();
  state='idle';
}

/* ═══════════ HUD ═══════════ */
function updateHUD(){
  levelEl.textContent=level;movesEl.textContent=movesLeft;
  movesCard.classList.toggle('danger',movesLeft<=5);
  hintBtn.innerHTML='💡 Подсказка · '+hintsLeft;hintBtn.disabled=hintsLeft<=0;
  const n=need(level);
  fillEl.style.width=Math.min(100,levelScore/n*100)+'%';
  progEl.textContent='цель '+n+' · осталось '+Math.max(0,n-levelScore);
  bestEl.textContent=best;
}
function updateScore(){
  if(score>best){best=score;bestEl.textContent=best}
  scoreEl.classList.remove('bump');void scoreEl.offsetWidth;
  scoreEl.classList.add('bump');
}
function showCombo(n){
  const el=$('comboToast');el.textContent='КОМБО ×'+n;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
let toastTimer=null;
function toastMsg(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
}
function showOverlay(emoji,title,html,label,cb){
  $('ovEmoji').textContent=emoji;$('ovTitle').textContent=title;
  $('ovText').innerHTML=html;
  const btn=$('ovBtn');btn.textContent=label;btn.onclick=()=>{sfx.ensure();cb()};
  $('overlay').classList.add('show');
}
function hideOverlay(){$('overlay').classList.remove('show')}
function spawnParticles(x,y,color){
  const col=COLORS[color];
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, sp=cell*(1.6+Math.random()*3.2);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-cell*1.2,
      r:cell*(.04+Math.random()*.05),life:.55+Math.random()*.3,t:0,color:col.main});
  }
  if(particles.length>400)particles.splice(0,particles.length-400);
}
function addFloater(text,x,y,color){floaters.push({text,x,y,t:0,color})}

/* ═══════════ ВВОД ═══════════ */
function cellFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX||e.touches?.[0]?.clientX)-rect.left;
  const y=(e.clientY||e.touches?.[0]?.clientY)-rect.top;
  const c=Math.floor(x/cell),r=Math.floor(y/cell);
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  return{r,c,x,y};
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();sfx.ensure();
  if(state!=='idle')return;
  const p=cellFromEvent(e);if(!p)return;
  if(sel&&sel.row===p.r&&sel.col===p.c){sel=null;return}
  if(sel&&Math.abs(sel.row-p.r)+Math.abs(sel.col-p.c)===1){
    trySwap(grid[sel.row][sel.col],grid[p.r][p.c]);return;
  }
  sel={row:p.r,col:p.c};sfx.tick();
  dragInfo={r:p.r,c:p.c,x:p.x,y:p.y,active:true};
});
canvas.addEventListener('pointermove',e=>{
  const p=cellFromEvent(e);hover=p?{r:p.r,c:p.c}:null;
  if(state!=='idle'||!p||!dragInfo||!dragInfo.active)return;
  const dx=p.x-dragInfo.x,dy=p.y-dragInfo.y;
  if(Math.hypot(dx,dy)>cell*.28){
    const dir=Math.abs(dx)>Math.abs(dy)?[0,Math.sign(dx)]:[Math.sign(dy),0];
    const r2=dragInfo.r+dir[0],c2=dragInfo.c+dir[1];
    dragInfo.active=false;sel=null;
    if(r2>=0&&c2>=0&&r2<ROWS&&c2<COLS)
      trySwap(grid[dragInfo.r][dragInfo.c],grid[r2][c2]);
  }
});
window.addEventListener('pointerup',()=>{if(dragInfo)dragInfo.active=false});

/* Клавиатура: перемещение курсора */
let kbCursor={r:0,c:0,active:false};
window.addEventListener('keydown',e=>{
  if(state!=='idle')return;
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],
              w:[-1,0],W:[-1,0],s:[1,0],S:[1,0],a:[0,-1],A:[0,-1],d:[0,1],D:[0,1]};
  if(dirs[e.key]){
    e.preventDefault();
    const[dr,dc]=dirs[e.key];
    kbCursor.active=true;
    kbCursor.r=Math.max(0,Math.min(ROWS-1,kbCursor.r+dr));
    kbCursor.c=Math.max(0,Math.min(COLS-1,kbCursor.c+dc));
    hover={r:kbCursor.r,c:kbCursor.c};
    return;
  }
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(!kbCursor.active)return;
    if(sel&&sel.row===kbCursor.r&&sel.col===kbCursor.c){sel=null;return}
    if(sel&&Math.abs(sel.row-kbCursor.r)+Math.abs(sel.col-kbCursor.c)===1){
      trySwap(grid[sel.row][sel.col],grid[kbCursor.r][kbCursor.c]);return;
    }
    sel={row:kbCursor.r,col:kbCursor.c};sfx.tick();
    return;
  }
  if(e.key==='Escape'){sel=null;kbCursor.active=false;hover=null}
});

$('newBtn').addEventListener('click',()=>{sfx.ensure();hideOverlay();newGame()});
hintBtn.addEventListener('click',()=>{
  if(state!=='idle'||hintsLeft<=0)return;
  const pair=findHintPair();
  if(!pair){toastMsg('Нет ходов!');return}
  hint=pair;hintUntil=tSec+4;hintsLeft--;updateHUD();sfx.tick();
});
$('soundBtn').addEventListener('click',function(){
  sfx.ensure();const on=sfx.toggle();
  this.textContent=on?'🔊 Звук':'🔇 Тихо';
});

/* ═══════════ ОБНОВЛЕНИЕ / РИСОВАНИЕ ═══════════ */
function update(dt){
  const g=cell*46;let any=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=grid[r]&&grid[r][c];
    if(!b||!b.falling)continue;
    any=true;
    b.vy+=g*dt;b.y+=b.vy*dt;
    if(b.y>=b.targetY){
      b.y=b.targetY;
      if(b.vy>cell*5){b.vy=-b.vy*.2;b.squash=.6;sfx.land()}
      else{b.vy=0;b.falling=false;b.squash=Math.max(b.squash,.45)}
    }
  }
  if(!any&&fallResolve){const f=fallResolve;fallResolve=null;f()}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=grid[r]&&grid[r][c];if(b)b.squash=Math.max(0,b.squash-dt*3.5);
  }
  if(hint&&tSec>hintUntil)hint=null;
  particles=particles.filter(p=>{p.t+=dt;if(p.t>=p.life)return false;
    p.vy+=cell*9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return true});
  floaters=floaters.filter(f=>{f.t+=dt;f.y-=cell*.8*dt;return f.t<1.1});
  displayScore+=(score-displayScore)*Math.min(1,dt*10);
  if(Math.abs(score-displayScore)<.6)displayScore=score;
  scoreEl.textContent=Math.round(displayScore);
}
function rr(x,y,w,h,rad){
  ctx.beginPath();ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();
}
function drawBall(x,y,r,colorIdx,alpha,squash,glow){
  if(r<=0)return;
  const col=COLORS[colorIdx];
  ctx.save();ctx.globalAlpha=alpha;
  // тень
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(x,y+r*.82,r*.72,r*.22,0,0,7);ctx.fill();
  ctx.translate(x,y);ctx.scale(1+.15*squash,1-.2*squash);
  if(glow){ctx.shadowColor=col.main;ctx.shadowBlur=r*1.2}
  // градиент неона
  const g=ctx.createRadialGradient(-r*.35,-r*.42,r*.1,0,0,r*1.05);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(.25,col.main);
  g.addColorStop(.75,col.main);
  g.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.shadowBlur=0;
  // блик
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.ellipse(-r*.36,-r*.42,r*.2,r*.12,-.6,0,7);ctx.fill();
  // внешний ободок свечения
  ctx.strokeStyle=col.glow;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(0,0,r*.96,0,7);ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,size,size);
  // клетки
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    ctx.fillStyle=(r+c)%2?'rgba(10,15,37,.5)':'rgba(16,22,50,.5)';
    rr(c*cell+2,r*cell+2,cell-4,cell-4,cell*.14);ctx.fill();
    ctx.strokeStyle='rgba(0,240,255,.06)';ctx.lineWidth=1;ctx.stroke();
  }
  // выделение sel
  if(sel){
    ctx.save();ctx.fillStyle='rgba(0,240,255,.12)';
    rr(sel.col*cell+2,sel.row*cell+2,cell-4,cell-4,cell*.14);ctx.fill();
    ctx.strokeStyle='rgba(0,240,255,.7)';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
  // шарики
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=grid[r][c];if(!b||b.scale<=0)continue;
    let oy=0,isHint=false;
    if(hint&&state==='idle'&&(hint[0]===b||hint[1]===b)){
      oy=Math.sin(tSec*6)*cell*.06;isHint=true;
    }
    drawBall(b.x,b.y+oy,cell*.375*b.scale,b.color,b.alpha,b.squash,isHint);
  }
  // hover
  if(hover&&state==='idle'){
    const b=grid[hover.r]&&grid[hover.r][hover.c];
    if(b&&!(sel&&sel.row===hover.r&&sel.col===hover.c)){
      ctx.strokeStyle='rgba(230,247,255,.4)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,cell*.46,0,7);ctx.stroke();
    }
  }
  // sel glow
  if(sel){
    const b=grid[sel.row]&&grid[sel.row][sel.col];
    if(b){
      const pr=1+Math.sin(tSec*7)*.08;
      ctx.strokeStyle='rgba(0,240,255,.55)';ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(b.x,b.y,cell*.375*1.3*pr,0,7);ctx.stroke();
      ctx.strokeStyle='#e6f7ff';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(b.x,b.y,cell*.375*1.22*pr,0,7);ctx.stroke();
    }
  }
  // частицы
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // всплывающие очки
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,1-f.t/1.1);
    ctx.font='800 '+Math.round(cell*.32)+'px Rajdhani,sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(5,6,15,.85)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;ctx.shadowBlur=10;
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;tSec+=dt;
  update(dt);draw();requestAnimationFrame(loop);
}

/* ═══════════ СТАРТ ═══════════ */
resize();
window.addEventListener('resize',resize);
updateHUD();
newGame();
loadStats();
requestAnimationFrame(loop);

});
</script>
</body>
