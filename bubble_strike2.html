<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ШАРИКИ: МЕТКИЙ СТРЕЛОК — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<style>
:root{
  --cyan:#00f0ff;
  --magenta:#ff00d4;
  --purple:#a855ff;
  --yellow:#ffe94d;
  --green:#00ff88;
  --red:#ff3355;
  --text:#e6f7ff;
  --panel:rgba(13,17,40,0.85);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at top, #0b0d1f, #05060f 75%);
  background-attachment:fixed;
  color:var(--text);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  overscroll-behavior:none;
}

/* ---------- HEADER ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:9px clamp(10px,3vw,22px);
  border-bottom:1px solid rgba(0,240,255,.18);
  box-shadow:0 0 24px rgba(0,240,255,.12);
  position:relative;z-index:5;flex-wrap:nowrap;flex-shrink:0;
}
.logo{
  font-weight:800;letter-spacing:1.6px;
  font-size:clamp(12px,3.1vw,18px);
  color:#fff;
  text-shadow:0 0 10px var(--cyan),0 0 22px rgba(0,240,255,.55);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logo span{color:var(--magenta);text-shadow:0 0 12px rgba(255,0,212,.9);}
.header-right{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.chip{
  font-size:clamp(9px,2.3vw,12px);
  font-weight:700;letter-spacing:.8px;
  padding:6px 10px;border-radius:999px;
  cursor:pointer;white-space:nowrap;
  border:1px solid rgba(0,240,255,.5);
  background:rgba(0,240,255,.08);
  color:var(--cyan);
  text-shadow:0 0 8px rgba(0,240,255,.8);
  transition:background .18s, box-shadow .18s, transform .12s;
  touch-action:manipulation;
}
.chip:active{transform:scale(.95);}
.chip:hover{background:rgba(0,240,255,.2);box-shadow:0 0 15px rgba(0,240,255,.5);}
.chip.lb{border-color:rgba(255,233,77,.6);color:var(--yellow);background:rgba(255,233,77,.08);text-shadow:0 0 8px rgba(255,233,77,.8);}
.chip.lb:hover{box-shadow:0 0 15px rgba(255,233,77,.5);background:rgba(255,233,77,.18);}
.chip.user{border-color:rgba(168,85,255,.6);color:var(--purple);background:rgba(168,85,255,.08);text-shadow:0 0 8px rgba(168,85,255,.8);cursor:default;}
.chip.user:hover{box-shadow:none;background:rgba(168,85,255,.08);}
.chip.menu{border-color:rgba(255,0,212,.6);color:var(--magenta);background:rgba(255,0,212,.08);text-shadow:0 0 8px rgba(255,0,212,.8);}
.chip.menu:hover{box-shadow:0 0 15px rgba(255,0,212,.5);background:rgba(255,0,212,.18);}

/* ---------- MAIN ---------- */
main{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:8px clamp(6px,2vw,16px) 10px;gap:8px;
}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex-shrink:0;}
.stat{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:10px;
  background:var(--panel);
  border:1px solid rgba(0,240,255,.22);
  box-shadow:inset 0 0 14px rgba(0,240,255,.07);
  font-size:clamp(9px,2.3vw,12px);letter-spacing:1px;
}
.stat .k{opacity:.55;font-weight:700;}
.stat .v{
  font-weight:800;font-size:clamp(12px,3.2vw,16px);
  color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.85);
  font-variant-numeric:tabular-nums;
}
.stat .v.yellow{color:var(--yellow);text-shadow:0 0 10px rgba(255,233,77,.85);}
.stat .v.magenta{color:var(--magenta);text-shadow:0 0 10px rgba(255,0,212,.85);}

.stage{
  flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;
  border:1px solid rgba(0,240,255,.18);
  box-shadow:0 0 30px rgba(0,240,255,.12),inset 0 0 40px rgba(0,240,255,.05);
  background:radial-gradient(ellipse at 50% 100%, rgba(0,240,255,.06), transparent 62%);
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:clamp(10px,2.7vw,12px);letter-spacing:1px;
  color:rgba(230,247,255,.7);
  background:rgba(13,17,40,.75);
  border:1px solid rgba(0,240,255,.25);
  padding:6px 14px;border-radius:999px;
  pointer-events:none;white-space:nowrap;
  transition:opacity .7s;z-index:4;
}
.hint.hide{opacity:0;}

/* ---------- OVERLAY ---------- */
.overlay{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(5,6,15,.82);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  z-index:10;padding:16px;
}
.overlay.show{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.panel{
  background:var(--panel);
  border:1px solid rgba(255,0,212,.45);
  box-shadow:0 0 30px rgba(255,0,212,.35),inset 0 0 30px rgba(255,0,212,.08);
  border-radius:18px;padding:24px 22px;text-align:center;
  max-width:340px;width:100%;
}
.panel h2{
  font-size:clamp(16px,5vw,24px);letter-spacing:2px;
  color:var(--red);text-shadow:0 0 14px rgba(255,51,85,.9);
  margin-bottom:10px;
}
.panel p{font-size:clamp(12px,3.5vw,16px);margin-bottom:18px;letter-spacing:1px;color:rgba(230,247,255,.85);}
.panel p b{color:var(--yellow);text-shadow:0 0 12px rgba(255,233,77,.9);font-size:1.4em;}
.btn{
  display:block;width:100%;margin:8px 0;padding:12px;
  border-radius:12px;border:1px solid var(--cyan);
  background:rgba(0,240,255,.1);color:var(--cyan);
  font-weight:800;letter-spacing:1.5px;
  font-size:clamp(12px,3.3vw,14px);
  cursor:pointer;text-shadow:0 0 10px rgba(0,240,255,.9);
  box-shadow:0 0 18px rgba(0,240,255,.25);
  transition:background .18s, box-shadow .18s, transform .12s;
  font-family:inherit;touch-action:manipulation;
}
.btn:hover{background:rgba(0,240,255,.22);box-shadow:0 0 26px rgba(0,240,255,.55);}
.btn:active{transform:scale(.97);}
.btn.ghost{
  border-color:var(--yellow);color:var(--yellow);
  background:rgba(255,233,77,.08);
  text-shadow:0 0 10px rgba(255,233,77,.9);
  box-shadow:0 0 18px rgba(255,233,77,.18);
}
.btn.ghost:hover{background:rgba(255,233,77,.18);box-shadow:0 0 26px rgba(255,233,77,.45);}
</style>
</head>
<body>

<header>
  <div class="logo">ШАРИКИ<span>·</span>МЕТКИЙ СТРЕЛОК</div>
  <div class="header-right">
    <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
    <div class="chip user" id="userChip">ИГРОК</div>
    <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
  </div>
</header>

<main>
  <div class="hud">
    <div class="stat"><span class="k">СЧЁТ</span><span class="v" id="scoreVal">0</span></div>
    <div class="stat"><span class="k">РЕКОРД</span><span class="v yellow" id="bestVal">0</span></div>
    <div class="stat"><span class="k">МИР</span><span class="v magenta" id="worldVal">—</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hint" id="hint">Тяни — прицелься · Отпусти — выстрел</div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="ovTitle">ИГРА ОКОНЧЕНА</h2>
        <p id="ovText">СЧЁТ: <b>0</b></p>
        <button class="btn" id="ovRestart">ИГРАТЬ СНОВА</button>
        <button class="btn ghost" id="ovLb">🏆 ЛИДЕРЫ</button>
      </div>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const GAME_ID = 'neon_bubble_shooter';

  /* ============================ DOM ============================ */
  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d');
  const stage    = document.getElementById('stage');
  const scoreEl  = document.getElementById('scoreVal');
  const bestEl   = document.getElementById('bestVal');
  const worldEl  = document.getElementById('worldVal');
  const overlay  = document.getElementById('overlay');
  const ovText   = document.getElementById('ovText');
  const hintEl   = document.getElementById('hint');
  const userChip = document.getElementById('userChip');

  /* ======================= PLATFORM API ======================== */
  const currentPlayer = (typeof Auth !== 'undefined' && Auth && Auth.get) ? Auth.get() : null;

  if (userChip) userChip.textContent = currentPlayer ? `👤 ${currentPlayer}` : 'ГОСТЬ';

  document.getElementById('lbHeaderBtn')?.addEventListener('click', () => {
    if (typeof LeaderboardUI !== 'undefined' && LeaderboardUI.open) LeaderboardUI.open(GAME_ID);
  });
  document.getElementById('menuBtn')?.addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  let bestScore = 0;

  async function loadStats() {
    try {
      const [myBest, globalRec] = await Promise.all([
        Leaderboard.getPlayerBest(GAME_ID, currentPlayer),
        Leaderboard.getGlobalRecord(GAME_ID)
      ]);
      if (typeof myBest === 'number') bestScore = myBest;
      if (bestEl) bestEl.textContent = Math.max(bestScore, score);
      if (globalRec && typeof globalRec.score === 'number' && worldEl) {
        worldEl.textContent = globalRec.score;
      }
    } catch (err) { /* тихо */ }
  }

  async function submitScore(finalScore) {
    if (currentPlayer && finalScore > 0 && typeof Leaderboard !== 'undefined') {
      try {
        await Leaderboard.submit(GAME_ID, currentPlayer, finalScore);
        await loadStats();
      } catch (err) { /* тихо */ }
    }
  }

  /* ========================== CONFIG =========================== */
  const COLS = 10;
  const COLORS = [
    { base: '#00f0ff', hi: '#bff9ff' },
    { base: '#ff00d4', hi: '#ffc7f0' },
    { base: '#ffe94d', hi: '#fff6bf' },
    { base: '#00ff88', hi: '#bfffdd' },
    { base: '#a855ff', hi: '#e0ccff' }
  ];
  const MAX_AIM = 1.32;          // радианы (~75°)
  const ROWS_START = 5;
  const SHOTS_PER_ROW = 7;

  /* ========================== STATE ============================ */
  let W = 360, H = 560;
  let R = 18, rowH = 31, gridLeft = 0, gridWidth = 360;
  let shooterY = 500, deathY = 460;
  let sprites = [];

  let topParity = 0;
  let grid = [];

  let bullets = [];
  let falling = [];
  let particles = [];

  let aim = 0;
  let score = 0;
  let combo = 0;
  let shotsLeft = SHOTS_PER_ROW;
  let state = 'ready';
  let currentColor = 0;
  let nextColor = 0;
  let dragging = false;
  let lastTime = performance.now();

  /* ========================= LAYOUT ============================ */
  function layout() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(240, Math.round(rect.width));
    H = Math.max(320, Math.round(rect.height));

    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = Math.min(W / (COLS * 2), H / 27);
    rowH = R * Math.sqrt(3);
    gridWidth = COLS * 2 * R;
    gridLeft = (W - gridWidth) / 2;
    shooterY = H - R * 2.4;
    deathY = shooterY - R * 1.9;

    buildSprites();
  }

  /* ========================= SPRITES =========================== */
  function buildSprites() {
    const pad = R * 1.1;
    const s = Math.ceil((R + pad) * 2);

    sprites = COLORS.map(col => {
      const cv = document.createElement('canvas');
      cv.width = s; cv.height = s;
      const g = cv.getContext('2d');
      const cx = s / 2, cy = s / 2;

      // внешнее свечение
      g.save();
      g.shadowColor = col.base;
      g.shadowBlur = R * 1.15;
      g.beginPath();
      g.arc(cx, cy, R * 0.92, 0, Math.PI * 2);
      g.fillStyle = col.base;
      g.fill();
      g.restore();

      // тело
      const grad = g.createRadialGradient(cx - R * 0.34, cy - R * 0.38, R * 0.06, cx, cy, R * 1.05);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.26, col.hi);
      grad.addColorStop(0.7, col.base);
      grad.addColorStop(1, 'rgba(0,0,0,0.62)');
      g.beginPath();
      g.arc(cx, cy, R * 0.92, 0, Math.PI * 2);
      g.fillStyle = grad;
      g.fill();

      // окантовка
      g.beginPath();
      g.arc(cx, cy, R * 0.92, 0, Math.PI * 2);
      g.strokeStyle = col.hi;
      g.globalAlpha = 0.65;
      g.lineWidth = Math.max(1, R * 0.09);
      g.stroke();
      g.globalAlpha = 1;

      // блик
      g.beginPath();
      g.arc(cx - R * 0.3, cy - R * 0.34, R * 0.15, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.fill();

      return cv;
    });
  }

  function drawBubble(x, y, ci, alpha) {
    const sp = sprites[ci];
    if (!sp) return;
    if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
    ctx.drawImage(sp, x - sp.width / 2, y - sp.height / 2);
    if (alpha !== undefined && alpha < 1) ctx.globalAlpha = 1;
  }

  /* ====================== GRID GEOMETRY ======================== */
  function rowPar(r) { return (topParity + r) & 1; }
  function colsInRow(r) { return rowPar(r) === 0 ? COLS : COLS - 1; }
  function cellX(r, c) { return gridLeft + R + c * 2 * R + (rowPar(r) ? R : 0); }
  function cellY(r) { return R + r * rowH; }

  function neighborList(r, c) {
    const par = rowPar(r);
    const raw = par === 1
      ? [[r, c - 1], [r, c + 1], [r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]]
      : [[r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]];
    const out = [];
    for (let i = 0; i < raw.length; i++) {
      const rr = raw[i][0], cc = raw[i][1];
      if (rr < 0 || cc < 0) continue;
      if (cc >= colsInRow(rr)) continue;
      out.push([rr, cc]);
    }
    return out;
  }

  function occupied(r, c) {
    const row = grid[r];
    if (!row) return false;
    const v = row[c];
    return v !== null && v !== undefined;
  }

  function ensureRow(r) {
    while (grid.length <= r) {
      grid.push(new Array(colsInRow(grid.length)).fill(null));
    }
  }

  function randColor() { return (Math.random() * COLORS.length) | 0; }

  function randColorAvoid(a, b) {
    let c = randColor(), guard = 0;
    while (guard++ < 24 && c === a && c === b) c = randColor();
    return c;
  }

  /* ========================= GAME SETUP ======================== */
  function resetGrid() {
    grid = [];
    topParity = 0;
    for (let r = 0; r < ROWS_START; r++) {
      const n = colsInRow(r);
      const row = new Array(n);
      for (let c = 0; c < n; c++) row[c] = randColorAvoid(row[c - 1], row[c - 2]);
      grid.push(row);
    }
  }

  function reset() {
    score = 0;
    combo = 0;
    shotsLeft = SHOTS_PER_ROW;
    bullets = [];
    falling = [];
    particles = [];
    aim = 0;
    state = 'ready';
    overlay.classList.remove('show');
    resetGrid();
    currentColor = randColor();
    nextColor = randColor();
    updateHUD();
    if (hintEl) {
      hintEl.classList.remove('hide');
      clearTimeout(reset._hintT);
      reset._hintT = setTimeout(() => hintEl.classList.add('hide'), 4200);
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = score;
    if (bestEl) bestEl.textContent = Math.max(bestScore, score);
  }

  /* ========================== SHOOTING ========================= */
  function muzzlePos() {
    return {
      x: W / 2 + Math.sin(aim) * R * 1.9,
      y: shooterY - Math.cos(aim) * R * 1.9
    };
  }

  function shoot() {
    if (state !== 'ready' || bullets.length > 0) return;

    const speed = Math.max(620, R * 48);
    const m = muzzlePos();

    bullets.push({
      x: m.x, y: m.y,
      vx: Math.sin(aim) * speed,
      vy: -Math.cos(aim) * speed,
      color: currentColor
    });

    currentColor = nextColor;
    nextColor = randColor();

    shotsLeft--;
    if (shotsLeft <= 0) {
      shotsLeft = SHOTS_PER_ROW;
      addRow();
    }
  }

  function collides(x, y) {
    const rApprox = Math.floor((y - R) / rowH);
    const r0 = Math.max(0, rApprox - 2);
    const r1 = Math.min(grid.length - 1, rApprox + 2);
    const lim = 2 * R * 0.94;
    const lim2 = lim * lim;
    for (let r = r0; r <= r1; r++) {
      const row = grid[r];
      if (!row) continue;
      const cy = cellY(r);
      for (let c = 0; c < row.length; c++) {
        if (row[c] === null || row[c] === undefined) continue;
        const dx = cellX(r, c) - x;
        const dy = cy - y;
        if (dx * dx + dy * dy < lim2) return true;
      }
    }
    return false;
  }

  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const speed = Math.hypot(b.vx, b.vy) || 1;
      let remaining = speed * dt;
      let ux = b.vx / speed;
      let uy = b.vy / speed;
      const maxStep = Math.max(2, R * 0.3);
      let hit = false;

      while (remaining > 0 && !hit) {
        const step = Math.min(maxStep, remaining);
        remaining -= step;

        b.x += ux * step;
        b.y += uy * step;

        if (b.x - R < gridLeft) { b.x = gridLeft + R; ux = -ux; }
        else if (b.x + R > gridLeft + gridWidth) { b.x = gridLeft + gridWidth - R; ux = -ux; }

        if (b.y - R <= 0) { b.y = R; hit = true; break; }
        if (collides(b.x, b.y)) { hit = true; break; }
      }

      b.vx = ux * speed;
      b.vy = uy * speed;

      if (hit) {
        placeBullet(b);
        bullets.splice(i, 1);
      } else if (b.y > H + R * 3) {
        bullets.splice(i, 1);
      }
    }
  }

  function isValidCell(r, c) {
    if (r === 0) return true;
    const nb = neighborList(r, c);
    for (let i = 0; i < nb.length; i++) {
      if (occupied(nb[i][0], nb[i][1])) return true;
    }
    return false;
  }

  function placeBullet(b) {
    let best = null, bestD = Infinity;
    const maxRows = grid.length + 2;

    for (let r = 0; r < maxRows; r++) {
      const n = colsInRow(r);
      const cy = cellY(r);
      for (let c = 0; c < n; c++) {
        if (occupied(r, c)) continue;
        if (!isValidCell(r, c)) continue;
        const dx = cellX(r, c) - b.x;
        const dy = cy - b.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = { r, c }; }
      }
    }
    if (!best) return;

    ensureRow(best.r);
    grid[best.r][best.c] = b.color;
    resolve(best.r, best.c);
  }

  /* ======================= MATCH RESOLVE ======================= */
  function findCluster(r0, c0, color) {
    const seen = new Set([r0 + ',' + c0]);
    const stack = [[r0, c0]];
    const out = [];
    while (stack.length) {
      const cur = stack.pop();
      out.push(cur);
      const nb = neighborList(cur[0], cur[1]);
      for (let i = 0; i < nb.length; i++) {
        const rr = nb[i][0], cc = nb[i][1];
        const k = rr + ',' + cc;
        if (seen.has(k)) continue;
        if (!occupied(rr, cc)) continue;
        if (grid[rr][cc] !== color) continue;
        seen.add(k);
        stack.push([rr, cc]);
      }
    }
    return out;
  }

  function findFloating() {
    const reach = new Set();
    const stack = [];
    if (grid[0]) {
      for (let c = 0; c < grid[0].length; c++) {
        if (occupied(0, c)) { reach.add('0,' + c); stack.push([0, c]); }
      }
    }
    while (stack.length) {
      const cur = stack.pop();
      const nb = neighborList(cur[0], cur[1]);
      for (let i = 0; i < nb.length; i++) {
        const rr = nb[i][0], cc = nb[i][1];
        const k = rr + ',' + cc;
        if (reach.has(k)) continue;
        if (!occupied(rr, cc)) continue;
        reach.add(k);
        stack.push([rr, cc]);
      }
    }
    const out = [];
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (occupied(r, c) && !reach.has(r + ',' + c)) out.push([r, c]);
      }
    }
    return out;
  }

  function addPop(x, y, ci) {
    const col = COLORS[ci].base;
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.45 + Math.random() * 0.35,
        t: 0,
        c: col,
        r: 1.5 + Math.random() * 2.8
      });
    }
  }

  function countBubbles() {
    let n = 0;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) if (row[c] !== null && row[c] !== undefined) n++;
    }
    return n;
  }

  function resolve(r, c) {
    const color = grid[r][c];
    const cluster = findCluster(r, c, color);

    if (cluster.length >= 3) {
      let gained = 0;

      for (let i = 0; i < cluster.length; i++) {
        const rr = cluster[i][0], cc = cluster[i][1];
        addPop(cellX(rr, cc), cellY(rr), grid[rr][cc]);
        grid[rr][cc] = null;
        gained += 10;
      }

      const floaters = findFloating();
      for (let i = 0; i < floaters.length; i++) {
        const rr = floaters[i][0], cc = floaters[i][1];
        const colIdx = grid[rr][cc];
        falling.push({
          x: cellX(rr, cc),
          y: cellY(rr),
          vx: (Math.random() - 0.5) * 90,
          vy: -60 - Math.random() * 90,
          color: colIdx
        });
        grid[rr][cc] = null;
        gained += 20;
      }

      combo++;
      const mult = 1 + Math.min(combo - 1, 4) * 0.25;
      score += Math.round(gained * mult);
      updateHUD();

      // очистка поля — бонус и новый набор
      if (countBubbles() === 0) {
        score += 500;
        updateHUD();
        resetGrid();
        return;
      }
    } else {
      combo = 0;
    }

    checkGameOver();
  }

  /* ========================= ROW / OVER ======================== */
  function addRow() {
    topParity = (topParity + 1) & 1;
    const n = colsInRow(0);
    const row = new Array(n);
    for (let c = 0; c < n; c++) row[c] = randColorAvoid(row[c - 1], row[c - 2]);
    grid.unshift(row);
    checkGameOver();
  }

  function checkGameOver() {
    if (state === 'over') return;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      const cy = cellY(r);
      if (cy - R > deathY) break;
      for (let c = 0; c < row.length; c++) {
        if (row[c] === null || row[c] === undefined) continue;
        if (cy + R >= deathY) { gameOver(); return; }
      }
    }
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    bullets = [];
    if (ovText) ovText.innerHTML = 'СЧЁТ: <b>' + score + '</b>';
    overlay.classList.add('show');
    submitScore(score);
  }

  /* ========================== PARTICLES ======================== */
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function updateFalling(dt) {
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.vy += 1500 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.y > H + R * 3) falling.splice(i, 1);
    }
  }

  /* =========================== UPDATE ========================== */
  function update(dt) {
    updateBullets(dt);
    updateFalling(dt);
    updateParticles(dt);
  }

  /* =========================== RENDER ========================== */
  function drawBackground() {
    // игровое поле
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(0,240,255,0.055)');
    grad.addColorStop(0.55, 'rgba(168,85,255,0.035)');
    grad.addColorStop(1, 'rgba(255,0,212,0.06)');
    ctx.fillStyle = grad;
    ctx.fillRect(gridLeft, 0, gridWidth, H);

    // боковые рейки
    ctx.save();
    ctx.strokeStyle = 'rgba(0,240,255,0.45)';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(gridLeft, 0); ctx.lineTo(gridLeft, H);
    ctx.moveTo(gridLeft + gridWidth, 0); ctx.lineTo(gridLeft + gridWidth, H);
    ctx.stroke();
    ctx.restore();

    // слабые горизонтальные линии
    ctx.strokeStyle = 'rgba(0,240,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 0; y < H; y += rowH * 2) {
      ctx.moveTo(gridLeft, y);
      ctx.lineTo(gridLeft + gridWidth, y);
    }
    ctx.stroke();

    // зона опасности
    const dz = ctx.createLinearGradient(0, deathY, 0, H);
    dz.addColorStop(0, 'rgba(255,51,85,0)');
    dz.addColorStop(1, 'rgba(255,51,85,0.18)');
    ctx.fillStyle = dz;
    ctx.fillRect(gridLeft, deathY, gridWidth, H - deathY);
  }

  function drawDeathLine() {
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -((performance.now() / 55) % 18);
    ctx.strokeStyle = 'rgba(255,51,85,0.8)';
    ctx.shadowColor = '#ff3355';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(gridLeft, deathY);
    ctx.lineTo(gridLeft + gridWidth, deathY);
    ctx.stroke();
    ctx.restore();
  }

  function traceAim() {
    const pts = [];
    const m = muzzlePos();
    let x = m.x, y = m.y;
    let ux = Math.sin(aim), uy = -Math.cos(aim);
    pts.push([x, y]);

    const step = Math.max(4, R * 0.5);
    const lim2 = (R * 1.86) * (R * 1.86);

    for (let i = 0; i < 300; i++) {
      x += ux * step;
      y += uy * step;

      if (x < gridLeft + R) { x = gridLeft + R; ux = -ux; pts.push([x, y]); }
      else if (x > gridLeft + gridWidth - R) { x = gridLeft + gridWidth - R; ux = -ux; pts.push([x, y]); }

      if (y <= R) break;

      let hit = false;
      const rApprox = Math.floor((y - R) / rowH);
      const r0 = Math.max(0, rApprox - 2);
      const r1 = Math.min(grid.length - 1, rApprox + 2);
      for (let r = r0; r <= r1 && !hit; r++) {
        const row = grid[r];
        if (!row) continue;
        const cy = cellY(r);
        for (let c = 0; c < row.length; c++) {
          if (row[c] === null || row[c] === undefined) continue;
          const dx = cellX(r, c) - x;
          const dy = cy - y;
          if (dx * dx + dy * dy < lim2) { hit = true; break; }
        }
      }
      if (hit) break;
      if (y > H) break;
    }
    pts.push([x, y]);
    return pts;
  }

  function drawAim() {
    if (state !== 'ready' || bullets.length > 0) return;
    const pts = traceAim();
    if (pts.length < 2) return;

    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.lineDashOffset = -((performance.now() / 40) % 14);
    ctx.strokeStyle = 'rgba(0,240,255,0.75)';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = Math.max(1.5, R * 0.1);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();

    // прицел на конце
    const last = pts[pts.length - 1];
    ctx.save();
    ctx.beginPath();
    ctx.arc(last[0], last[1], R * 0.95, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.restore();
  }

  function drawShooter() {
    const sx = W / 2, sy = shooterY;

    // база
    ctx.save();
    const g = ctx.createRadialGradient(sx, sy, R * 0.15, sx, sy, R * 1.3);
    g.addColorStop(0, 'rgba(0,240,255,0.35)');
    g.addColorStop(1, 'rgba(0,240,255,0.02)');
    ctx.beginPath();
    ctx.arc(sx, sy, R * 1.28, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,240,255,0.85)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.restore();

    // ствол
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(aim);
    ctx.beginPath();
    ctx.moveTo(-R * 0.44, 0);
    ctx.lineTo(-R * 0.26, -R * 2.3);
    ctx.lineTo(R * 0.26, -R * 2.3);
    ctx.lineTo(R * 0.44, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,240,255,0.13)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,240,255,0.9)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.restore();

    // текущий шар
    if (state === 'ready' && bullets.length === 0) {
      const m = muzzlePos();
      drawBubble(m.x, m.y, currentColor);
    }

    // следующий шар
    const nx = W - R * 2.1;
    const ny = shooterY + R * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.arc(nx, ny, R * 1.2, 0, Math.PI * 2);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(230,247,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    drawBubble(nx, ny, nextColor, 0.85);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawDeathLine();
    drawAim();

    // сетка
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      const cy = cellY(r);
      if (cy - R > H + R * 3) break;
      for (let c = 0; c < row.length; c++) {
        const v = row[c];
        if (v === null || v === undefined) continue;
        drawBubble(cellX(r, c), cy, v);
      }
    }

    // падающие
    for (let i = 0; i < falling.length; i++) {
      drawBubble(falling[i].x, falling[i].y, falling[i].color, 0.9);
    }

    // летящие
    for (let i = 0; i < bullets.length; i++) {
      drawBubble(bullets[i].x, bullets[i].y, bullets[i].color);
    }

    // частицы
    if (particles.length) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const a = 1 - p.t / p.life;
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.8), 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    drawShooter();
  }

  /* =========================== INPUT =========================== */
  function pointerAim(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const dx = px - W / 2;
    const dy = shooterY - py;
    let a = Math.atan2(dx, Math.max(dy, 1));
    if (a > MAX_AIM) a = MAX_AIM;
    if (a < -MAX_AIM) a = -MAX_AIM;
    aim = a;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'ready') return;
    e.preventDefault();
    pointerAim(e);
    dragging = true;
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (state !== 'ready') return;
    if (dragging || e.pointerType === 'mouse') pointerAim(e);
  }, { passive: true });

  canvas.addEventListener('pointerup', (e) => {
    if (state !== 'ready') { dragging = false; return; }
    if (dragging) {
      dragging = false;
      pointerAim(e);
      shoot();
    }
  }, { passive: true });

  canvas.addEventListener('pointercancel', () => { dragging = false; });

  // Клавиатура
  const keys = Object.create(null);

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'spacebar' || k === 'enter') {
      e.preventDefault();
      shoot();
      return;
    }
    if (k === 'escape') {
      window.location.href = 'index.html';
      return;
    }
    if (k === 'arrowleft' || k === 'a' || k === 'arrowright' || k === 'd' ||
        k === 'arrowup' || k === 'w' || k === 'arrowdown' || k === 's') {
      keys[k] = true;
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function handleKeys(dt) {
    if (state !== 'ready') return;
    const left  = keys['arrowleft'] || keys['a'];
    const right = keys['arrowright'] || keys['d'];
    if (left && !right)  aim = Math.max(-MAX_AIM, aim - 1.9 * dt);
    if (right && !left)  aim = Math.min(MAX_AIM, aim + 1.9 * dt);
  }

  /* ========================== GAME LOOP ======================== */
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    handleKeys(dt);
    if (state === 'ready') update(dt);
    else { updateFalling(dt); updateParticles(dt); }
    render();
    requestAnimationFrame(loop);
  }

  /* =========================== INIT ============================ */
  document.getElementById('ovRestart')?.addEventListener('click', reset);
  document.getElementById('ovLb')?.addEventListener('click', () => {
    if (typeof LeaderboardUI !== 'undefined' && LeaderboardUI.open) LeaderboardUI.open(GAME_ID);
  });

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 160));

  layout();
  reset();
  loadStats();
  lastTime = performance.now();
  requestAnimationFrame(loop);
});
</script>
</body>
