<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON 2048</title>
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #05010d;
  --grid-bg: rgba(15, 5, 40, 0.7);
  --cell-bg: rgba(30, 15, 60, 0.4);
  --border: rgba(140, 90, 255, 0.2);
  --cyan: #00f0ff;
  --magenta: #ff2bd6;
  --purple: #a855ff;
  --yellow: #ffe94d;
  --red: #ff5c6a;
  --text: #e9e3ff;
  --gap: 12px;
  --cell: 100px;
  --rad: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse 1200px 800px at 20% 10%, rgba(168,85,255,.18), transparent),
    radial-gradient(ellipse 1000px 700px at 85% 90%, rgba(0,240,255,.14), transparent),
    radial-gradient(ellipse 800px 600px at 50% 50%, rgba(255,43,214,.1), transparent),
    var(--bg);
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; padding: 16px; touch-action: none;
}
.wrap { width: min(520px, 100%); display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
h1 {
  font-size: clamp(24px, 6vw, 40px); font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 16px rgba(168,85,255,.4));
}
.header-right { display: flex; gap: 8px; align-items: center; }
.chip {
  font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700;
  border: 1px solid rgba(255,255,255,.2); padding: 8px 12px; border-radius: 8px;
  background: rgba(255,255,255,.06); white-space: nowrap; cursor: pointer;
  transition: transform .15s, border-color .2s, color .2s; letter-spacing: 1px;
}
.chip:hover { transform: translateY(-2px); border-color: var(--cyan); color: #fff; }
.chip.user { color: var(--cyan); border-color: rgba(0,240,255,.4); background: rgba(0,240,255,.08); }
.chip.lb { color: var(--yellow); border-color: rgba(255,233,77,.4); background: rgba(255,233,77,.08); }
.chip.logout { color: var(--red); border-color: rgba(255,92,106,.4); background: rgba(255,92,106,.08); }

.scores { display: flex; gap: 8px; }
.score {
  min-width: 82px; padding: 6px 12px; border-radius: 10px; text-align: center;
  background: rgba(15,8,35,.7); border: 1px solid var(--border);
  box-shadow: 0 0 10px rgba(168,85,255,.2), inset 0 0 8px rgba(0,240,255,.06);
}
.score .l { font-size: 9px; letter-spacing: 2px; color: #a898d8; text-transform: uppercase; }
.score .v { font-size: 20px; font-weight: 800; color: var(--cyan); text-shadow: 0 0 6px rgba(0,240,255,.6); }
.score.best .v { color: var(--magenta); text-shadow: 0 0 6px rgba(255,43,214,.6); }
.score.record .v { color: var(--yellow); text-shadow: 0 0 6px rgba(255,233,77,.6); }

.ctrl { display: flex; justify-content: space-between; align-items: center; }
.hint { font-size: 11px; color: #a898d8; letter-spacing: 1px; }
.btn {
  padding: 9px 16px; border-radius: 10px; cursor: pointer;
  background: linear-gradient(135deg, rgba(0,240,255,.12), rgba(255,43,214,.12));
  border: 1px solid rgba(168,85,255,.45); color: var(--text);
  font-weight: 700; letter-spacing: 2px; font-size: 11px; text-transform: uppercase;
  box-shadow: 0 0 12px rgba(0,240,255,.2), 0 0 18px rgba(255,43,214,.15);
  transition: transform .12s, border-color .15s;
}
.btn:hover { border-color: var(--cyan); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }

.board-wrap {
  position: relative;
  width: calc(var(--cell)*4 + var(--gap)*5);
  aspect-ratio: 1;
  margin: 0 auto;
}
.board {
  position: absolute; inset: 0;
  background: var(--grid-bg); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 0 28px rgba(168,85,255,.3), inset 0 0 24px rgba(0,240,255,.06);
}
.cells {
  position: absolute; inset: var(--gap);
  display: grid; grid-template: repeat(4, var(--cell)) / repeat(4, var(--cell)); gap: var(--gap);
}
.cell {
  border-radius: var(--rad); background: var(--cell-bg);
  border: 1px solid rgba(140,90,255,.12);
}
.tiles {
  position: absolute; inset: var(--gap);
  pointer-events: none;
}

.tile {
  position: absolute; left: 0; top: 0;
  width: var(--cell); height: var(--cell);
  border-radius: var(--rad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 40px;
  border: 1px solid rgba(255,255,255,.12);
  translate: var(--tx) var(--ty);
  transition: translate 130ms ease-in-out;
  will-change: translate;
}
.tile.spawn {
  transition: none;
  animation: spawn 320ms ease-out;
}
@keyframes spawn {
  0%   { transform: scale(0);   opacity: 0; filter: brightness(3.5) drop-shadow(0 0 30px #fff); }
  35%  { transform: scale(1.2); opacity: 1; filter: brightness(2.4) drop-shadow(0 0 22px #fff); }
  65%  { transform: scale(0.9);             filter: brightness(1.4) drop-shadow(0 0 8px rgba(255,255,255,.4)); }
  100% { transform: scale(1);               filter: brightness(1)   drop-shadow(0 0 0 transparent); }
}
.tile.merge-pop {
  animation: mpop 240ms ease-out;
}
@keyframes mpop {
  0%   { transform: scale(1);   filter: brightness(1); }
  40%  { transform: scale(1.3); filter: brightness(1.8) drop-shadow(0 0 16px #fff); }
  100% { transform: scale(1);   filter: brightness(1)   drop-shadow(0 0 0 transparent); }
}

.v2    { background: linear-gradient(135deg,#081828,#0e2838); color:#a0fcff; box-shadow: 0 0 12px rgba(0,240,255,.5),  inset 0 0 10px rgba(0,240,255,.2); }
.v4    { background: linear-gradient(135deg,#082038,#0e3050); color:#80e8ff; box-shadow: 0 0 14px rgba(0,200,255,.55), inset 0 0 12px rgba(0,200,255,.22); }
.v8    { background: linear-gradient(135deg,#180838,#281050); color:#d0b4ff; box-shadow: 0 0 16px rgba(168,85,255,.6),  inset 0 0 14px rgba(168,85,255,.25); }
.v16   { background: linear-gradient(135deg,#280838,#401058); color:#ffb4f0; box-shadow: 0 0 18px rgba(200,70,220,.65), inset 0 0 16px rgba(200,70,220,.28); }
.v32   { background: linear-gradient(135deg,#380828,#580e38); color:#ff9fd8; box-shadow: 0 0 20px rgba(255,43,214,.7),  inset 0 0 18px rgba(255,43,214,.3); }
.v64   { background: linear-gradient(135deg,#380818,#581018); color:#ff9faa; box-shadow: 0 0 22px rgba(255,60,90,.75),  inset 0 0 20px rgba(255,60,90,.32); }
.v128  { background: linear-gradient(135deg,#382800,#584000); color:#fff0a0; box-shadow: 0 0 24px rgba(255,233,77,.8),  inset 0 0 22px rgba(255,233,77,.35); font-size:36px; }
.v256  { background: linear-gradient(135deg,#283800,#405800); color:#e0ff80; box-shadow: 0 0 26px rgba(180,255,60,.8),  inset 0 0 24px rgba(180,255,60,.35); font-size:36px; }
.v512  { background: linear-gradient(135deg,#003828,#005840); color:#80ffd4; box-shadow: 0 0 28px rgba(60,255,180,.85), inset 0 0 26px rgba(60,255,180,.38); font-size:36px; }
.v1024 { background: linear-gradient(135deg,#003038,#004858); color:#80f0ff; box-shadow: 0 0 32px rgba(0,240,255,.9),  inset 0 0 28px rgba(0,240,255,.4);  font-size:30px; }
.v2048 { background: linear-gradient(135deg,#382800,#583a00,#382800); color:#fff6b0; font-size:30px;
  box-shadow: 0 0 36px rgba(255,215,80,1), 0 0 72px rgba(255,180,40,.7), inset 0 0 32px rgba(255,230,120,.5);
  animation: glow 1.5s ease-in-out infinite alternate; }
.vsuper { background: linear-gradient(135deg,#180030,#300050,#180030); color:#fff; font-size:26px;
  box-shadow: 0 0 36px rgba(255,43,214,1), 0 0 72px rgba(0,240,255,.85), inset 0 0 36px rgba(168,85,255,.6);
  animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { from{filter:brightness(1)} to{filter:brightness(1.35)} }

.overlay {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: rgba(5,1,13,.82); border-radius: 16px; z-index: 10;
  border: 1px solid var(--border); backdrop-filter: blur(4px);
}
.overlay.show { display: flex; animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.overlay h2 { font-size: 44px; letter-spacing: 5px; font-weight: 900; }
.overlay.win h2 {
  background: linear-gradient(90deg, var(--yellow), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.overlay.lose h2 {
  background: linear-gradient(90deg, var(--magenta), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.overlay p { color: #c0b8e8; letter-spacing: 2px; font-size: 13px; }
.btns { display: flex; gap: 10px; }

/* Модалка таблицы лидеров */
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5,1,13,.9); backdrop-filter: blur(8px);
}
.modal.hidden { display: none; }
.modal-box {
  background: linear-gradient(180deg, rgba(24,29,63,.98), rgba(13,17,40,.98));
  border: 1px solid var(--border); border-radius: 16px; padding: 32px;
  max-width: 500px; width: 90%; box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
}
.modal-title {
  font-size: 20px; font-weight: 900; letter-spacing: 3px; text-align: center; margin-bottom: 24px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.leaderboards { max-height: 400px; overflow-y: auto; margin-top: 20px; }
.lb-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 8px; background: rgba(13,17,40,.6); margin-bottom: 8px;
  transition: background .2s;
}
.lb-row:hover { background: rgba(0,240,255,.08); }
.lb-row.me { background: rgba(0,240,255,.12); border: 1px solid rgba(0,240,255,.3); }
.lb-rank { font-weight: 900; font-size: 14px; color: var(--yellow); min-width: 32px; }
.lb-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
.lb-score { font-weight: 800; font-size: 13px; color: var(--cyan); }
.lb-empty, .lb-loading { text-align: center; color: #a898d8; padding: 20px; font-size: 13px; }
.lb-refresh {
  font-size: 11px; padding: 8px 16px;
  background: rgba(0,240,255,.1); border: 1px solid rgba(0,240,255,.3);
  color: var(--cyan); border-radius: 8px; cursor: pointer; margin-bottom: 12px;
  transition: all .2s; font-weight: 700; letter-spacing: 1px;
}
.lb-refresh:hover { background: rgba(0,240,255,.2); transform: translateY(-2px); }

@media (max-width:520px) {
  :root { --cell: 72px; --gap: 9px; }
  .tile { font-size: 30px; }
  .v128,.v256,.v512 { font-size: 26px; }
  .v1024,.v2048 { font-size: 22px; }
  .vsuper { font-size: 18px; }
  header { justify-content: center; }
  .header-right { width: 100%; justify-content: center; margin-top: 8px; }
  .score { min-width: 64px; padding: 5px 8px; }
  .score .v { font-size: 16px; }
}
@media (max-width:360px) {
  :root { --cell: 62px; --gap: 7px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NEON 2048</h1>
    <div class="header-right">
      <!-- УБРАН onclick, добавлен id для безопасного addEventListener -->
      <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
      <div class="chip user" id="userChip">ИГРОК</div>
      <div class="chip logout" id="logoutBtn">ВЫЙТИ</div>
    </div>
  </header>
  
<div class="scores">
    <div class="score"><div class="l">Score</div><div class="v" id="sc">0</div></div>
    <div class="score best"><div class="l">Best</div><div class="v" id="bs">0</div></div>
    <div class="score record"><div class="l">Record</div><div class="v" id="rc">0</div></div>
</div>

  <div class="ctrl">
    <div class="hint">← ↑ ↓ → / WASD / Swipe</div>
    <button class="btn" id="newBtn">New Game</button>
  </div>

  <div class="board-wrap" id="bw">
    <div class="board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="overlay win" id="winOv">
      <h2>YOU WIN!</h2><p>2048 reached</p>
      <div class="btns">
        <button class="btn" id="keepBtn">Keep Going</button>
        <button class="btn" id="winNewBtn">New Game</button>
      </div>
    </div>
    <div class="overlay lose" id="loseOv">
      <h2>GAME OVER</h2><p>No moves left</p>
      <div class="btns"><button class="btn" id="loseNewBtn">Try Again</button></div>
    </div>
  </div>
</div>

<!-- Модалка таблицы лидеров -->
<div class="modal hidden" id="lbModal">
  <div class="modal-box">
    <div class="modal-title">🏆 ТАБЛИЦА ЛИДЕРОВ</div>
    <button class="lb-refresh" id="lbRefresh">🔄 ОБНОВИТЬ</button>
    <div class="leaderboards" id="leaderboards"></div>
    <div style="margin-top:20px">
      <button class="btn" id="lbClose" style="width:100%">ЗАКРЫТЬ</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  console.log('🚀 2048: Инициализация...');

  // 1. ПРОВЕРКА АВТОРИЗАЦИИ
  if (typeof Auth === 'undefined') {
    console.error('❌ Файл auth.js не загружен!');
    window.location.replace('index.html');
    return;
  }
  
  if (!Auth.isSessionValid()) {
    console.warn('⚠️ Сессия недействительна, редирект на главную.');
    window.location.replace('index.html');
    return;
  }

  const currentPlayer = Auth.currentUser();
  console.log('✅ Авторизован как:', currentPlayer);

  // 2. ПРИВЯЗКА ИНТЕРФЕЙСА
  const userChip = document.getElementById('userChip');
  if (userChip && currentPlayer) {
    userChip.textContent = `👤 ${currentPlayer}`;
    console.log('✅ Имя игрока отображено.');
  }

  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      console.log('🚪 Выход из системы...');
      Auth.logout();
      window.location.replace('index.html');
    });
  }

  // Глобальная функция на всякий случай
  window.doLogout = function() {
    Auth.logout();
    window.location.replace('index.html');
  };

// 3. КОНФИГУРАЦИЯ SUPABASE
const SUPABASE_URL = 'https://ovoacfpdgupfdrdmomgp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wt0MIOGgL0V_qbOCOudyJw_CiG19rO1';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function fetchleaderboards(gameId){
  try{
    const { data, error } = await sb
      .from('leaderboards')
      .select('username, score')
      .eq('game_id', gameId)
      .order('score', { ascending: false })
      .limit(50);
    if (error) throw error;
    return data || [];
  } catch(e){
    console.warn('⚠️ Ошибка Supabase:', e);
    try {
      const local = localStorage.getItem('n2048_leaderboards');
      return local ? JSON.parse(local) : [];
    } catch { return []; }
  }
}

async function saveScoreToCloud(gameId, username, score){
  try{
    const { data: existing, error: selErr } = await sb
      .from('leaderboards')
      .select('id, score')
      .eq('game_id', gameId)
      .eq('username', username)
      .maybeSingle();
    if (selErr) throw selErr;

    if (existing){
      if (score > existing.score){
        const { error } = await sb
          .from('leaderboards')
          .update({ score, date: new Date().toISOString() })
          .eq('id', existing.id);
        if (error) throw error;
      }
    } else {
      const { error } = await sb
        .from('leaderboards')
        .insert({ game_id: gameId, username, score });
      if (error) throw error;
    }
    return true;
  } catch(e){
    console.error('❌ Ошибка сохранения рекорда:', e);
    return false;
  }
}

async function fetchPlayerBest(gameId, username){
  try{
    const { data, error } = await sb
      .from('leaderboards')
      .select('score')
      .eq('game_id', gameId)
      .eq('username', username)
      .maybeSingle();
    if (error) throw error;
    return (data && typeof data.score === 'number') ? data.score : 0;
  }catch(e){
    console.warn('⚠️ Ошибка загрузки личного рекорда:', e);
    return Auth.getBest('2048') || 0;
  }
}

async function fetchGlobalRecord(gameId){
  try{
    const { data, error } = await sb
      .from('leaderboards')
      .select('username, score')
      .eq('game_id', gameId)
      .order('score', { ascending: false })
      .limit(1);
    if (error) throw error;
    return data && data[0]
      ? { username: data[0].username, score: data[0].score }
      : { username: '—', score: 0 };
  }catch(e){
    console.warn('⚠️ Ошибка загрузки общего рекорда:', e);
    return { username: '—', score: 0 };
  }
}

  // 4. ФУНКЦИИ ЛИДЕРБОРДА
async function submitScore(score) {
  if (!currentPlayer) return;
  await saveScoreToCloud('2048', currentPlayer, score);
}

  async function openleaderboards() {
    console.log('🏆 Открытие таблицы лидеров...');
    const modal = document.getElementById('lbModal');
    const lb = document.getElementById('leaderboards');
    if (!modal || !lb) return;
    
    modal.classList.remove('hidden');
    lb.innerHTML = '<div class="lb-loading">⏳ Загрузка таблицы...</div>';
    
    try {
		const gameLb = await fetchleaderboards('2048');
      
      if (!gameLb || gameLb.length === 0) {
        lb.innerHTML = '<div class="lb-empty">Пока нет рекордов. Сыграйте первую игру!</div>';
        return;
      }
      
      lb.innerHTML = gameLb.map((entry, i) => {
        const isMe = currentPlayer && entry.username.toLowerCase() === currentPlayer.toLowerCase();
        return `<div class="lb-row ${isMe ? 'me' : ''}">
          <div class="lb-rank">#${i+1}</div>
          <div class="lb-name">${escapeHtml(entry.username)}${isMe ? ' (вы)' : ''}</div>
          <div class="lb-score">${Number(entry.score).toLocaleString()}</div>
        </div>`;
      }).join('');
      console.log('✅ Таблица лидеров успешно загружена.');
    } catch (err) {
      console.error('❌ Критическая ошибка при открытии таблицы:', err);
      lb.innerHTML = '<div class="lb-empty">Ошибка загрузки данных. См. консоль (F12).</div>';
    }
  }

  function escapeHtml(str) { 
    const div = document.createElement('div'); 
    div.textContent = str; 
    return div.innerHTML; 
  }

  // 5. НАЗНАЧЕНИЕ СОБЫТИЙ (Безопасное, через addEventListener)
  const lbCloseBtn = document.getElementById('lbClose');
  if (lbCloseBtn) lbCloseBtn.addEventListener('click', () => {
    document.getElementById('lbModal').classList.add('hidden');
  });

  const lbRefreshBtn = document.getElementById('lbRefresh');
  if (lbRefreshBtn) lbRefreshBtn.addEventListener('click', openleaderboards);
  
  const lbHeaderBtn = document.getElementById('lbHeaderBtn');
  if (lbHeaderBtn) {
    lbHeaderBtn.addEventListener('click', (e) => {
      e.preventDefault();
      openleaderboards();
    });
  }

  console.log('✅ Все обработчики событий успешно назначены.');

  // ==========================================
  // 6. ЛОГИКА ИГРЫ 2048
  // ==========================================
  const S = 4, WIN = 2048, DUR = 140;
  const $ = id => document.getElementById(id);
  const cellsEl = $('cells'), tilesEl = $('tiles');
  const scEl = $('sc'), bsEl = $('bs');
  const winOv = $('winOv'), loseOv = $('loseOv'), bw = $('bw');

  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    cellsEl.appendChild(c);
  }

  let grid, tm, nid, score, best, won, keep, busy;
  let savedThisGame = false;

  function px() {
    const s = getComputedStyle(document.documentElement);
    return { c: parseFloat(s.getPropertyValue('--cell')), g: parseFloat(s.getPropertyValue('--gap')) };
  }

  function setPos(t) {
    const { c, g } = px();
    t.el.style.setProperty('--tx', `${t.col * (c + g)}px`);
    t.el.style.setProperty('--ty', `${t.row * (c + g)}px`);
  }

  function vc(v) { return v <= 2048 ? 'v' + v : 'vsuper'; }

  function mkEl(t) {
    const el = document.createElement('div');
    el.className = 'tile spawn ' + vc(t.value);
    el.textContent = t.value;
    t.el = el;
    setPos(t);
    tilesEl.appendChild(el);
    el.addEventListener('animationend', () => el.classList.remove('spawn'), { once: true });
  }

  function updVal(t) {
    t.el.className = 'tile merge-pop ' + vc(t.value);
    t.el.textContent = t.value;
    t.el.addEventListener('animationend', () => t.el.classList.remove('merge-pop'), { once: true });
  }

  function rmEl(t) {
    if (t.el?.parentNode) t.el.remove();
    t.el = null;
  }

  function empty() {
    const e = [];
    for (let r = 0; r < S; r++)
      for (let c = 0; c < S; c++)
        if (!grid[r][c]) e.push([r, c]);
    return e;
  }

  function spawn() {
    const e = empty();
    if (!e.length) return;
    const [r, c] = e[Math.random() * e.length | 0];
    const t = { id: nid++, value: Math.random() < .9 ? 2 : 4, row: r, col: c, el: null };
    grid[r][c] = t;
    tm.set(t.id, t);
    mkEl(t);
  }

const rcEl = document.getElementById('rc');

async function loadBest() {
  bsEl.textContent = '…';
  rcEl.textContent = '…';
  const [playerBest, globalRec] = await Promise.all([
    fetchPlayerBest('2048', currentPlayer),
    fetchGlobalRecord('2048')
  ]);
  best = playerBest;
  bsEl.textContent = best;
  rcEl.textContent = Number(globalRec.score).toLocaleString();
  rcEl.title = globalRec.username && globalRec.username !== '—'
    ? `Рекорд: ${globalRec.username}`
    : '';
}

function checkAndSaveBest() {
  // Обновляем только локальный дисплей и localStorage.
  // Никаких запросов в Supabase здесь — только в конце партии.
  if (score > best) {
    best = score;
    Auth.setBest('2048', best);
    bsEl.textContent = best;
  }
}

function saveGame() {
  if (savedThisGame) return;
  if (!score || score <= 0) return;
  savedThisGame = true;
  console.log('💾 Отправка рекорда в Supabase:', score);
  submitScore(score).then(loadBest).catch(err => {
    console.warn('⚠️ Не удалось сохранить рекорд:', err);
  });
}

function reset() {
  saveGame();                       // сохранить прошлую партию, если была
  savedThisGame = false;            // новая партия — счётчик сброшен

  tilesEl.innerHTML = '';
  grid = Array.from({ length: S }, () => Array(S).fill(null));
  tm = new Map();
  nid = 1; score = 0; won = false; keep = false; busy = false;
  scEl.textContent = '0';
  winOv.classList.remove('show');
  loseOv.classList.remove('show');
  spawn();
  spawn();
}

  function move(dir) {
    if (busy) return;
    if (winOv.classList.contains('show') || loseOv.classList.contains('show')) return;

    const isR = dir === 'left' || dir === 'right';
    const rev = dir === 'right' || dir === 'down';
    let moved = false, gained = 0;
    const merges = [];

    for (let li = 0; li < S; li++) {
      const cells = [];
      for (let ci = 0; ci < S; ci++) {
        const r = isR ? li : (rev ? S - 1 - ci : ci);
        const c = isR ? (rev ? S - 1 - ci : ci) : li;
        cells.push({ r, c, t: grid[r][c] });
      }

      const pr = cells.filter(x => x.t).map(x => x.t);
      const res = [];
      let i = 0;
      while (i < pr.length) {
        if (i + 1 < pr.length && pr[i].value === pr[i + 1].value) {
          res.push({ k: pr[i], v: pr[i + 1], nv: pr[i].value * 2 });
          gained += pr[i].value * 2;
          i += 2;
        } else {
          res.push({ k: pr[i], v: null, nv: null });
          i++;
        }
      }

      for (let j = 0; j < res.length; j++) {
        const tgt = cells[j], e = res[j];
        if (e.k.row !== tgt.r || e.k.col !== tgt.c) moved = true;
        e.k.row = tgt.r;
        e.k.col = tgt.c;
        if (e.v) {
          if (e.v.row !== tgt.r || e.v.col !== tgt.c) moved = true;
          e.v.row = tgt.r;
          e.v.col = tgt.c;
          merges.push(e);
        }
      }
    }

    if (!moved) return;
    busy = true;

    for (const t of tm.values()) setPos(t);

    setTimeout(() => {
      for (const m of merges) {
        rmEl(m.v);
        tm.delete(m.v.id);
        m.k.value = m.nv;
        updVal(m.k);
        if (m.nv === WIN && !won) {
          won = true;
          if (!keep) setTimeout(() => winOv.classList.add('show'), 180);
        }
      }

      grid = Array.from({ length: S }, () => Array(S).fill(null));
      for (const t of tm.values()) grid[t.row][t.col] = t;

      score += gained;
      scEl.textContent = score;
      checkAndSaveBest();
      spawn();

      let over = true;
      outer:
      for (let r = 0; r < S; r++)
        for (let c = 0; c < S; c++) {
          if (!grid[r][c]) { over = false; break outer; }
          const v = grid[r][c].value;
          if (c + 1 < S && grid[r][c + 1]?.value === v) { over = false; break outer; }
          if (r + 1 < S && grid[r + 1]?.[c]?.value === v) { over = false; break outer; }
        }
if (over) {
  setTimeout(() => loseOv.classList.add('show'), 280);
  saveGame();
}

busy = false;
    }, DUR + 15);
  }

  const km = {
    ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
    a:'left', d:'right', w:'up', s:'down',
    A:'left', D:'right', W:'up', S:'down'
  };
  window.addEventListener('keydown', e => {
    const d = km[e.key];
    if (d) { e.preventDefault(); move(d); }
  });

  let ts = null;
  bw.addEventListener('touchstart', e => {
    if (e.touches.length === 1) ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  bw.addEventListener('touchmove', e => { if (ts) e.preventDefault(); }, { passive: false });
  bw.addEventListener('touchend', e => {
    if (!ts) return;
    const t = e.changedTouches[0], dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    ts = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  let ms = null;
  bw.addEventListener('mousedown', e => { ms = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseup', e => {
    if (!ms) return;
    const dx = e.clientX - ms.x, dy = e.clientY - ms.y;
    ms = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  $('newBtn').onclick = $('winNewBtn').onclick = $('loseNewBtn').onclick = reset;
  $('keepBtn').onclick = () => { keep = true; winOv.classList.remove('show'); };

  loadBest();
  reset();
  console.log('✅ Игра 2048 полностью инициализирована и готова к работе.');
});
</script>
