<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON MATCH-3 — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<style>
  :root {
    --bg-gradient: radial-gradient(ellipse at top, #0b0d1f, #05060f 75%);
    --cyan: #00f0ff;
    --magenta: #ff00d4;
    --purple: #a855ff;
    --yellow: #ffe94d;
    --green: #00ff88;
    --red: #ff3355;
    --text: #e6f7ff;
    --panel-bg: rgba(13, 17, 40, 0.85);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background: var(--bg-gradient);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- Header --- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--cyan);
    box-shadow: 0 0 15px var(--cyan);
    z-index: 10;
  }

  .logo {
    font-size: clamp(1rem, 4vw, 1.4rem);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }

  .header-right {
    display: flex;
    gap: 8px;
  }

  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    background: rgba(0, 240, 255, 0.1);
    color: var(--text);
    transition: all 0.2s;
  }

  .chip:active { transform: scale(0.95); }
  .chip.lb { border-color: var(--yellow); box-shadow: 0 0 8px var(--yellow); color: var(--yellow); }
  .chip.menu { border-color: var(--magenta); box-shadow: 0 0 8px var(--magenta); color: var(--magenta); }

  /* --- Main Game Area --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 16px;
  }

  .game-info {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    justify-content: space-around;
  }

  .stat-box {
    background: var(--panel-bg);
    border: 1px solid var(--purple);
    box-shadow: 0 0 10px var(--purple);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    flex: 1;
  }

  .stat-label { font-size: 0.75rem; color: #a0a0c0; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 1.4rem; font-weight: 900; color: var(--text); text-shadow: 0 0 8px var(--text); }
  #score-val { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }
  #time-val { color: var(--red); text-shadow: 0 0 8px var(--red); }

  .board-container {
    width: min(90vw, 500px);
    aspect-ratio: 1 / 1;
    background: var(--panel-bg);
    border: 2px solid var(--purple);
    border-radius: 12px;
    box-shadow: 0 0 25px var(--purple), inset 0 0 20px rgba(168, 85, 255, 0.2);
    padding: 8px;
    position: relative;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 4px;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .cell {
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
    position: relative;
  }

  .cell.selected {
    transform: scale(1.15);
    z-index: 2;
    border: 2px solid #ffffff;
    box-shadow: 0 0 25px #ffffff, inset 0 0 10px #ffffff;
  }

  /* Neon Ball Colors */
  .color-cyan { background: var(--cyan); box-shadow: 0 0 15px var(--cyan), inset 0 0 10px rgba(255,255,255,0.5); }
  .color-magenta { background: var(--magenta); box-shadow: 0 0 15px var(--magenta), inset 0 0 10px rgba(255,255,255,0.5); }
  .color-purple { background: var(--purple); box-shadow: 0 0 15px var(--purple), inset 0 0 10px rgba(255,255,255,0.5); }
  .color-yellow { background: var(--yellow); box-shadow: 0 0 15px var(--yellow), inset 0 0 10px rgba(255,255,255,0.5); }
  .color-green { background: var(--green); box-shadow: 0 0 15px var(--green), inset 0 0 10px rgba(255,255,255,0.5); }
  .color-red { background: var(--red); box-shadow: 0 0 15px var(--red), inset 0 0 10px rgba(255,255,255,0.5); }

  /* --- Modal --- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 15, 0.92);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 1;
    transition: opacity 0.3s;
  }

  .modal.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .modal-content {
    background: var(--panel-bg);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 30px var(--cyan);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    max-width: 90vw;
    width: 320px;
  }

  .modal-content h2 {
    margin: 0 0 16px 0;
    color: var(--magenta);
    text-shadow: 0 0 10px var(--magenta);
    font-size: 1.8rem;
  }

  .modal-content p {
    font-size: 1.2rem;
    margin-bottom: 24px;
  }

  .neon-btn {
    background: transparent;
    color: var(--cyan);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 15px var(--cyan);
    padding: 12px 32px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .neon-btn:hover, .neon-btn:active {
    background: var(--cyan);
    color: #05060f;
    box-shadow: 0 0 25px var(--cyan);
  }

  .global-record {
    margin-top: 16px;
    font-size: 0.9rem;
    color: #a0a0c0;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 12px;
  }
  .global-record span { color: var(--yellow); font-weight: bold; }
</style>
</head>
<body>

<header>
  <div class="logo">NEON MATCH-3</div>
  <div class="header-right">
    <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
    <div class="chip user" id="userChip">ГОСТЬ</div>
    <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
  </div>
</header>

<main>
  <div class="game-info">
    <div class="stat-box">
      <div class="stat-label">Счёт</div>
      <div class="stat-value" id="score-val">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Время</div>
      <div class="stat-value" id="time-val">60</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Рекорд</div>
      <div class="stat-value" id="best-val" style="color: var(--green); text-shadow: 0 0 8px var(--green);">0</div>
    </div>
  </div>

  <div class="board-container">
    <div id="board"></div>
  </div>
</main>

<div id="game-over-modal" class="modal hidden">
  <div class="modal-content">
    <h2>ВРЕМЯ ВЫШЛО!</h2>
    <p>Ваш счёт: <span id="final-score" style="color: var(--yellow); text-shadow: 0 0 8px var(--yellow);">0</span></p>
    <div class="global-record">
      Мировой рекорд: <span id="global-user">-</span> (<span id="global-score">0</span>)
    </div>
    <br>
    <button id="restart-btn" class="neon-btn">ИГРАТЬ СНОВА</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  // --- 1. API & Platform Integration ---
  const GAME_ID = 'neon-match3';
  const currentPlayer = typeof Auth !== 'undefined' ? Auth.get() : null;
  
  const userChip = document.getElementById('userChip');
  if (userChip) {
    userChip.textContent = currentPlayer ? `👤 ${currentPlayer}` : '👤 ГОСТЬ';
  }

  document.getElementById('lbHeaderBtn')?.addEventListener('click', () => {
    if (typeof LeaderboardUI !== 'undefined') LeaderboardUI.open(GAME_ID);
  });

  document.getElementById('menuBtn')?.addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  async function loadStats() {
    try {
      const [myBest, globalRec] = await Promise.all([
        typeof Leaderboard !== 'undefined' ? Leaderboard.getPlayerBest(GAME_ID, currentPlayer) : 0,
        typeof Leaderboard !== 'undefined' ? Leaderboard.getGlobalRecord(GAME_ID) : { username: '-', score: 0 }
      ]);
      document.getElementById('best-val').textContent = myBest || 0;
      document.getElementById('global-user').textContent = globalRec?.username || '-';
      document.getElementById('global-score').textContent = globalRec?.score || 0;
    } catch (e) {
      console.warn('Leaderboard load failed:', e);
    }
  }

  async function onGameOver(finalScore) {
    if (currentPlayer && finalScore > 0) {
      try {
        if (typeof Leaderboard !== 'undefined') {
          await Leaderboard.submit(GAME_ID, currentPlayer, finalScore);
        }
      } catch (e) {
        console.warn('Leaderboard submit failed:', e);
      }
    }
    loadStats(); // Обновить отображаемый рекорд
  }

  // --- 2. Game Logic ---
  const ROWS = 8;
  const COLS = 8;
  const COLORS = ['cyan', 'magenta', 'purple', 'yellow', 'green', 'red'];
  
  let grid = [];
  let score = 0;
  let timeLeft = 60;
  let timerInterval = null;
  let isProcessing = false;
  let startR = null, startC = null, startX = 0, startY = 0;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score-val');
  const timeEl = document.getElementById('time-val');
  const modalEl = document.getElementById('game-over-modal');
  const finalScoreEl = document.getElementById('final-score');

  function getRandomColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
  }

  function createBoard() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        let color;
        do {
          color = getRandomColor();
        } while (
          (c >= 2 && grid[r][c-1] === color && grid[r][c-2] === color) ||
          (r >= 2 && grid[r-1][c] === color && grid[r-2][c] === color)
        );
        grid[r][c] = color;
      }
    }
    renderBoard();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = `cell color-${grid[r][c]}`;
        cell.dataset.r = r;
        cell.dataset.c = c;
        boardEl.appendChild(cell);
      }
    }
  }

  function findMatches() {
    let matches = new Set();
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 2; c++) {
        let color = grid[r][c];
        if (color && grid[r][c+1] === color && grid[r][c+2] === color) {
          matches.add(`${r},${c}`);
          matches.add(`${r},${c+1}`);
          matches.add(`${r},${c+2}`);
        }
      }
    }
    // Vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS - 2; r++) {
        let color = grid[r][c];
        if (color && grid[r+1][c] === color && grid[r+2][c] === color) {
          matches.add(`${r},${c}`);
          matches.add(`${r+1},${c}`);
          matches.add(`${r+2},${c}`);
        }
      }
    }
    return Array.from(matches).map(str => {
      let [r, c] = str.split(',').map(Number);
      return {r, c};
    });
  }

  async function processMatches() {
    let matches = findMatches();
    if (matches.length === 0) {
      isProcessing = false;
      return false;
    }

    // Начисление очков (бонус за комбо)
    score += matches.length * 10 * (matches.length > 3 ? 2 : 1);
    scoreEl.textContent = score;

    // Удаление
    for (let m of matches) {
      grid[m.r][m.c] = null;
    }
    renderBoard();
    await new Promise(res => setTimeout(res, 250));

    // Падение
    for (let c = 0; c < COLS; c++) {
      let emptySlots = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] === null) {
          emptySlots++;
        } else if (emptySlots > 0) {
          grid[r + emptySlots][c] = grid[r][c];
          grid[r][c] = null;
        }
      }
      // Заполнение сверху
      for (let r = 0; r < emptySlots; r++) {
        grid[r][c] = getRandomColor();
      }
    }
    renderBoard();
    await new Promise(res => setTimeout(res, 250));

    // Каскад
    return processMatches();
  }

  function swap(r1, c1, r2, c2) {
    let temp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = temp;
  }

  async function handleInput(r1, c1, r2, c2) {
    if (isProcessing) return;
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;

    isProcessing = true;
    swap(r1, c1, r2, c2);
    renderBoard();

    await new Promise(res => setTimeout(res, 200));

    if (findMatches().length > 0) {
      await processMatches();
    } else {
      // Откат если нет совпадений
      swap(r1, c1, r2, c2);
      renderBoard();
      isProcessing = false;
    }
  }

  // --- 3. Input Handling (Mouse + Touch) ---
  boardEl.addEventListener('pointerdown', (e) => {
    if (isProcessing || timeLeft <= 0) return;
    let cell = e.target.closest('.cell');
    if (!cell) return;
    
    startR = parseInt(cell.dataset.r);
    startC = parseInt(cell.dataset.c);
    startX = e.clientX;
    startY = e.clientY;

    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');
    e.preventDefault(); // Prevent text selection/scrolling
  });

  boardEl.addEventListener('pointerup', (e) => {
    if (isProcessing || startR === null || timeLeft <= 0) return;
    
    let dx = e.clientX - startX;
    let dy = e.clientY - startY;
    
    // Если это был просто клик (без свайпа), можно добавить логику выбора второго элемента, 
    // но для мобильной аркады свайп надежнее. Минимальный порог свайпа = 15px.
    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
      startR = null;
      return;
    }

    let endR = startR;
    let endC = startC;

    if (Math.abs(dx) > Math.abs(dy)) {
      endC += dx > 0 ? 1 : -1;
    } else {
      endR += dy > 0 ? 1 : -1;
    }

    if (endR >= 0 && endR < ROWS && endC >= 0 && endC < COLS) {
      handleInput(startR, startC, endR, endC);
    }

    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
    startR = null;
  });

  // Предотвращение скролла на мобильных внутри доски
  boardEl.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  // --- 4. Game Loop & Control ---
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 60;
    timeEl.textContent = timeLeft;
    timerInterval = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    clearInterval(timerInterval);
    isProcessing = true; // Блокируем доску
    finalScoreEl.textContent = score;
    modalEl.classList.remove('hidden');
    onGameOver(score);
  }

  function initGame() {
    score = 0;
    scoreEl.textContent = '0';
    modalEl.classList.add('hidden');
    isProcessing = false;
    createBoard();
    startTimer();
  }

  document.getElementById('restart-btn').addEventListener('click', initGame);

  // Запуск
  loadStats();
  initGame();
});
</script>
</body>
</html>
