<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON MATCH-3 — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<style>
    :root {
        --c-bg: #05060f;
        --c-panel: rgba(13, 17, 40, 0.85);
        --c-cyan: #00f0ff;
        --c-magenta: #ff00d4;
        --c-purple: #a855ff;
        --c-yellow: #ffe94d;
        --c-green: #00ff88;
        --c-red: #ff3355;
        --c-text: #e6f7ff;
    }

    body {
        margin: 0;
        background: radial-gradient(ellipse at top, #0b0d1f, var(--c-bg) 75%);
        color: var(--c-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
        font-size: 1.2rem;
        font-weight: 700;
        text-shadow: 0 0 8px var(--c-cyan);
    }

    .header-right {
        display: flex;
        gap: 8px;
    }

    .chip {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        cursor: pointer;
        user-select: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.2s ease;
    }

    .chip:hover {
        box-shadow: 0 0 15px var(--c-cyan);
        transform: translateY(-2px);
    }

    .chip.lb { background: var(--c-panel); border-color: var(--c-yellow); color: var(--c-yellow); }
    .chip.user { background: var(--c-panel); border-color: var(--c-purple); color: var(--c-purple); }
    .chip.menu { background: var(--c-panel); border-color: var(--c-red); color: var(--c-red); }

    .game-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        gap: 16px;
    }

    .game-board {
        position: relative;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        background: var(--c-panel);
        padding: 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ball {
        width: 100%;
        padding-top: 100%;
        position: relative;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.1s ease;
        border: 2px solid transparent;
    }

    .ball.cyan { background: var(--c-cyan); box-shadow: 0 0 15px var(--c-cyan); }
    .ball.magenta { background: var(--c-magenta); box-shadow: 0 0 15px var(--c-magenta); }
    .ball.purple { background: var(--c-purple); box-shadow: 0 0 15px var(--c-purple); }
    .ball.yellow { background: var(--c-yellow); box-shadow: 0 0 15px var(--c-yellow); }
    .ball.green { background: var(--c-green); box-shadow: 0 0 15px var(--c-green); }

    .ball.selected { border-color: var(--c-yellow); transform: scale(1.1); }
    .ball.swapping { transition: transform 0.2s ease; }
    .ball.falling { transition: transform 0.3s ease; }

    .game-ui {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 200px;
        background: var(--c-panel);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ui-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ui-label {
        font-size: 0.85rem;
        opacity: 0.8;
    }

    .ui-value {
        font-size: 1.4rem;
        font-weight: 700;
        text-shadow: 0 0 6px var(--c-yellow);
    }

    .btn {
        padding: 12px;
        background: var(--c-panel);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
    }

    .btn:hover { box-shadow: 0 0 15px var(--c-cyan); transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(45deg, var(--c-cyan), var(--c-magenta)); color: #000; }
    .btn-danger { background: var(--c-red); color: #fff; }

    .game-over {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 20px;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .game-over.active {
        opacity: 1;
        pointer-events: all;
    }

    .game-over h2 {
        text-shadow: 0 0 10px var(--c-red);
    }

    @media (max-width: 768px) {
        .game-container { flex-direction: column; }
        .game-board { width: 100%; max-width: 400px; }
        .game-ui { width: 100%; min-width: auto; }
        .game-board { grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px; }
    }
</style>
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
</head>
<body>

<header>
    <div class="logo">NEON MATCH-3</div>
    <div class="header-right">
        <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
        <div class="chip user" id="userChip">ИГРОК</div>
        <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
    </div>
</header>

<div class="game-container">
    <div class="game-ui">
        <div class="ui-row">
            <span class="ui-label">СЧЁТ</span>
            <span class="ui-value" id="score">0</span>
        </div>
        <div class="ui-row">
            <span class="ui-label">ХОДЫ</span>
            <span class="ui-value" id="moves">20</span>
        </div>
        <div class="ui-row">
            <span class="ui-label">РЕКОРД</span>
            <span class="ui-value" id="best">0</span>
        </div>
        <div class="ui-row">
            <button class="btn btn-primary" id="hintBtn">💡 ПОДСКАЗКА</button>
        </div>
        <div class="ui-row">
            <button class="btn btn-danger" id="restartBtn">🔄 ЗАНОВО</button>
        </div>
    </div>

    <div class="game-board" id="gameBoard"></div>
</div>

<div class="game-over" id="gameOver">
    <h2>ИГРА ОКОНЧЕНА</h2>
    <div style="font-size: 1.2rem;">Твой счёт: <span id="finalScore">0</span></div>
    <button class="btn btn-primary" id="submitScoreBtn">ЗАГРУЗИТЬ РЕКОРД</button>
    <button class="btn" id="playAgainBtn">ИГРАТЬ ЕЩЁ</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    'use strict';
    const GAME_ID = 'neon-match3';
    const COLORS = ['cyan', 'magenta', 'purple', 'yellow', 'green'];
    const ROWS = 8;
    const COLS = 8;
    const START_MOVES = 20;

    const currentPlayer = Auth.get();
    const userChip = document.getElementById('userChip');
    if (userChip) {
        userChip.textContent = currentPlayer ? `👤 ${currentPlayer}` : 'ГОСТЬ';
    }

    document.getElementById('lbHeaderBtn')?.addEventListener('click', () => {
        LeaderboardUI.open(GAME_ID);
    });
    document.getElementById('menuBtn')?.addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    let board = [];
    let score = 0;
    let movesLeft = START_MOVES;
    let selected = null;
    let isBusy = false;

    const scoreEl = document.getElementById('score');
    const movesEl = document.getElementById('moves');
    const bestEl = document.getElementById('best');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const gameBoard = document.getElementById('gameBoard');
    const restartBtn = document.getElementById('restartBtn');
    const hintBtn = document.getElementById('hintBtn');
    const submitScoreBtn = document.getElementById('submitScoreBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');

    function createBoard() {
        board = [];
        gameBoard.innerHTML = '';
        gameBoard.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
        gameBoard.style.gap = `${Math.max(2, Math.floor((window.innerWidth * 0.6) / COLS / 20))}px`;
        
        for (let r = 0; r < ROWS; r++) {
            board[r] = [];
            for (let c = 0; c < COLS; c++) {
                let color;
                do {
                    color = COLORS[Math.floor(Math.random() * COLORS.length)];
                } while (
                    (r > 1 && board[r-1][c] === color && board[r-2][c] === color) || 
                    (c > 1 && board[r][c-1] === color && board[r][c-2] === color)
                );
                
                const ball = document.createElement('div');
                ball.classList.add('ball', color);
                ball.dataset.r = r;
                ball.dataset.c = c;
                ball.addEventListener('click', onBallClick);
                gameBoard.appendChild(ball);
                board[r][c] = { color, el: ball };
            }
        }
    }

    function onBallClick(e) {
        if (isBusy) return;
        const ball = e.currentTarget;
        if (selected === ball) {
            selected.classList.remove('selected');
            selected = null;
            return;
        }
        if (selected) {
            const r1 = parseInt(selected.dataset.r);
            const c1 = parseInt(selected.dataset.c);
            const r2 = parseInt(ball.dataset.r);
            const c2 = parseInt(ball.dataset.c);
            
            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                swapBalls(selected, ball, true);
            } else {
                selected.classList.remove('selected');
                selected = ball;
                selected.classList.add('selected');
            }
        } else {
            selected = ball;
            selected.classList.add('selected');
        }
    }

    async function swapBalls(a, b, isPlayerMove) {
        isBusy = true;
        a.classList.add('swapping');
        b.classList.add('swapping');

        const r1 = parseInt(a.dataset.r), c1 = parseInt(a.dataset.c);
        const r2 = parseInt(b.dataset.r), c2 = parseInt(b.dataset.c);

        [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        [a.dataset.r, b.dataset.r] = [r2, r1];
        [a.dataset.c, b.dataset.c] = [c2, c1];

        await new Promise(res => setTimeout(res, 200));

        a.classList.remove('swapping');
        b.classList.remove('swapping');

        if (findMatches().length > 0) {
            if (isPlayerMove) {
                movesLeft--;
                movesEl.textContent = movesLeft;
            }
            selected = null;
            await resolveBoard();
        } else {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
            [a.dataset.r, b.dataset.r] = [r1, r2];
            [a.dataset.c, b.dataset.c] = [c1, c2];
            a.classList.add('swapping');
            b.classList.add('swapping');
            await new Promise(res => setTimeout(res, 200));
            a.classList.remove('swapping');
            b.classList.remove('swapping');
            if (isPlayerMove) selected = null;
        }

        if (isPlayerMove && movesLeft <= 0) {
            endGame();
        }
        isBusy = false;
    }

    function findMatches() {
        const matches = [];
        const checked = Array(ROWS).fill().map(() => Array(COLS).fill(false));

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (checked[r][c]) continue;
                const color = board[r][c].color;
                const vert = [];
                for (let i = r; i < ROWS && board[i][c].color === color; i++) {
                    vert.push({r: i, c});
                    checked[i][c] = true;
                }
                if (vert.length >= 3) matches.push(vert);

                const horz = [];
                for (let i = c; i < COLS && board[r][i].color === color; i++) {
                    horz.push({r, c: i});
                    checked[r][i] = true;
                }
                if (horz.length >= 3) matches.push(horz);
            }
        }
        return matches;
    }

    async function resolveBoard() {
        let totalScoreGain = 0;
        let hasAction = true;

        while (hasAction) {
            const matches = findMatches();
            if (matches.length === 0) break;

            hasAction = true;
            const removed = new Set();
            for (const chain of matches) {
                for (const cell of chain) {
                    removed.add(`${cell.r}-${cell.c}`);
                    score += 10;
                    totalScoreGain += 10;
                    board[cell.r][cell.c].el.remove();
                    board[cell.r][cell.c] = null;
                }
            }
            scoreEl.textContent = score;

            await new Promise(res => setTimeout(res, 250));

            for (let c = 0; c < COLS; c++) {
                let emptyRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c]) {
                        if (r !== emptyRow) {
                            board[emptyRow][c] = board[r][c];
                            board[r][c] = null;
                            board[emptyRow][c].el.dataset.r = emptyRow;
                            board[emptyRow][c].el.classList.add('falling');
                            board[emptyRow][c].el.style.transform = `translateY(${(emptyRow - r) * 100}%)`;
                        }
                        emptyRow--;
                    }
                }

                for (let r = emptyRow; r >= 0; r--) {
                    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    const ball = document.createElement('div');
                    ball.classList.add('ball', color);
                    ball.dataset.r = r;
                    ball.dataset.c = c;
                    ball.addEventListener('click', onBallClick);
                    ball.style.transform = 'translateY(-400px)';
                    gameBoard.appendChild(ball);
                    board[r][c] = { color, el: ball };
                    
                    await new Promise(res => setTimeout(res, 40));
                    
                    ball.classList.add('falling');
                    ball.style.transform = 'translateY(0)';
                }
            }

            await new Promise(res => setTimeout(res, 300));
        }

        if (totalScoreGain > 0 && findMatches().length === 0) {
            hintBtn.disabled = false;
        }
    }

    function endGame() {
        isBusy = true;
        finalScoreEl.textContent = score;
        gameOverEl.classList.add('active');
        onGameOver(score);
    }

    async function onGameOver(finalScore) {
        if (currentPlayer && finalScore > 0) {
            await Leaderboard.submit(GAME_ID, currentPlayer, finalScore);
            loadStats();
        }
    }

    async function loadStats() {
        const [myBest, globalRec] = await Promise.all([
            Leaderboard.getPlayerBest(GAME_ID, currentPlayer),
            Leaderboard.getGlobalRecord(GAME_ID)
        ]);
        bestEl.textContent = myBest || 0;
    }

    restartBtn.addEventListener('click', () => {
        score = 0;
        movesLeft = START_MOVES;
        scoreEl.textContent = score;
        movesEl.textContent = movesLeft;
        gameOverEl.classList.remove('active');
        createBoard();
        isBusy = false;
        selected = null;
        loadStats();
    });

    playAgainBtn.addEventListener('click', () => {
        score = 0;
        movesLeft = START_MOVES;
        scoreEl.textContent = score;
        movesEl.textContent = movesLeft;
        gameOverEl.classList.remove('active');
        createBoard();
        isBusy = false;
        selected = null;
        loadStats();
    });

    hintBtn.addEventListener('click', () => {
        const swaps = findPossibleSwaps();
        if (swaps.length > 0) {
            const [a, b] = swaps[0];
            selected = a;
            a.classList.add('selected');
            setTimeout(() => swapBalls(a, b, false), 500);
        }
        hintBtn.disabled = true;
    });

    function findPossibleSwaps() {
        const swaps = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = board[r][c];
                if (c < COLS - 1) {
                    swapTemp(cell, board[r][c+1]);
                    if (findMatches().length > 0) swaps.push([cell.el, board[r][c+1].el]);
                    swapTemp(cell, board[r][c+1]);
                }
                if (r < ROWS - 1) {
                    swapTemp(cell, board[r+1][c]);
                    if (findMatches().length > 0) swaps.push([cell.el, board[r+1][c].el]);
                    swapTemp(cell, board[r+1][c]);
                }
            }
        }
        return swaps;
    }

    function swapTemp(a, b) {
        const temp = a.color;
        a.color = b.color;
        b.color = temp;
        a.el.className = 'ball ' + a.color;
        b.el.className = 'ball ' + b.color;
    }

    createBoard();
    loadStats();
});
</script>
</body>
</html>
