<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ШАРИКИ: МЕТКИЙ СТРЕЛОК — NEON ARCADE</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<style>
:root{
  --cyan:#00f0ff;
  --magenta:#ff00d4;
  --purple:#a855ff;
  --yellow:#ffe94d;
  --green:#00ff88;
  --red:#ff3355;
  --text:#e6f7ff;
  --panel:rgba(13,17,40,0.85);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at top, #0b0d1f, #05060f 75%);
  background-attachment:fixed;
  color:var(--text);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  overscroll-behavior:none;
}

/* ---------- HEADER ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:9px clamp(10px,3vw,22px);
  border-bottom:1px solid rgba(0,240,255,.14);
  box-shadow:0 2px 20px rgba(0,0,0,.4);
  position:relative;z-index:5;flex-wrap:nowrap;flex-shrink:0;
}
.logo{
  font-weight:800;letter-spacing:1.6px;
  font-size:clamp(12px,3.1vw,18px);
  color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 12px rgba(0,240,255,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logo span{color:#ff77e0;}
.header-right{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.chip{
  font-size:clamp(9px,2.3vw,12px);
  font-weight:700;letter-spacing:.8px;
  padding:6px 10px;border-radius:999px;
  cursor:pointer;white-space:nowrap;
  border:1px solid rgba(0,240,255,.4);
  background:linear-gradient(180deg, rgba(0,240,255,.16), rgba(0,240,255,.04));
  color:#bff4ff;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.35);
  transition:background .18s, box-shadow .18s, transform .12s;
  touch-action:manipulation;
}
.chip:active{transform:scale(.95);}
.chip:hover{background:linear-gradient(180deg, rgba(0,240,255,.28), rgba(0,240,255,.1));}
.chip.lb{color:#fff3b0;border-color:rgba(255,233,77,.45);background:linear-gradient(180deg, rgba(255,233,77,.18), rgba(255,233,77,.04));}
.chip.lb:hover{background:linear-gradient(180deg, rgba(255,233,77,.3), rgba(255,233,77,.1));}
.chip.user{color:#e0c9ff;border-color:rgba(168,85,255,.4);background:linear-gradient(180deg, rgba(168,85,255,.16), rgba(168,85,255,.03));cursor:default;}
.chip.user:hover{background:linear-gradient(180deg, rgba(168,85,255,.16), rgba(168,85,255,.03));}
.chip.menu{color:#ffb0e8;border-color:rgba(255,0,212,.42);background:linear-gradient(180deg, rgba(255,0,212,.16), rgba(255,0,212,.03));}
.chip.menu:hover{background:linear-gradient(180deg, rgba(255,0,212,.28), rgba(255,0,212,.08));}
.chip.sound{
  color:#a7ffe0;border-color:rgba(0,255,136,.42);
  background:linear-gradient(180deg, rgba(0,255,136,.16), rgba(0,255,136,.03));
  min-width:34px;text-align:center;
}
.chip.sound:hover{background:linear-gradient(180deg, rgba(0,255,136,.28), rgba(0,255,136,.08));}
.chip.sound.off{
  color:#8a97b8;border-color:rgba(120,140,180,.35);
  background:linear-gradient(180deg, rgba(120,140,180,.12), rgba(120,140,180,.03));
}

/* ---------- MAIN ---------- */
main{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:8px clamp(6px,2vw,16px) 10px;gap:8px;
}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex-shrink:0;}
.stat{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:10px;
  background:linear-gradient(180deg, rgba(30,36,66,.85), rgba(13,17,40,.9));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.4);
  font-size:clamp(9px,2.3vw,12px);letter-spacing:1px;
}
.stat .k{opacity:.55;font-weight:700;}
.stat .v{
  font-weight:800;font-size:clamp(12px,3.2vw,16px);
  color:#c9f3ff;
  text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 10px rgba(150,240,255,.5);
  font-variant-numeric:tabular-nums;
}
.stat .v.yellow{color:#fff0a8;text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 10px rgba(255,233,77,.5);}
.stat .v.magenta{color:#ffb6ee;text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 10px rgba(255,0,212,.5);}

.stage{
  flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 6px 30px rgba(0,0,0,.55), inset 0 0 60px rgba(0,240,255,.04);
  background:radial-gradient(ellipse at 50% 0%, rgba(80,120,180,.10), transparent 60%),
             linear-gradient(180deg, rgba(20,26,48,.6), rgba(8,10,24,.85));
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:clamp(10px,2.7vw,12px);letter-spacing:1px;
  color:rgba(230,247,255,.85);
  background:linear-gradient(180deg, rgba(30,36,66,.85), rgba(13,17,40,.9));
  border:1px solid rgba(255,255,255,.1);
  padding:6px 14px;border-radius:999px;
  pointer-events:none;white-space:nowrap;
  transition:opacity .7s;z-index:4;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
}
.hint.hide{opacity:0;}

/* ---------- OVERLAY ---------- */
.overlay{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(5,6,15,.82);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  z-index:10;padding:16px;
}
.overlay.show{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.panel{
  background:linear-gradient(180deg, rgba(30,36,66,.9), rgba(13,17,40,.95));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14), 0 0 30px rgba(255,51,85,.2);
  border-radius:18px;padding:24px 22px;text-align:center;
  max-width:340px;width:100%;
}
.panel h2{
  font-size:clamp(16px,5vw,24px);letter-spacing:2px;
  color:#ff8ba0;text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 16px rgba(255,51,85,.6);
  margin-bottom:10px;
}
.panel p{font-size:clamp(12px,3.5vw,16px);margin-bottom:18px;letter-spacing:1px;color:rgba(230,247,255,.85);}
.panel p b{color:#fff0a8;text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 14px rgba(255,233,77,.6);font-size:1.4em;}
.btn{
  display:block;width:100%;margin:8px 0;padding:12px;
  border-radius:12px;border:1px solid rgba(0,240,255,.5);
  background:linear-gradient(180deg, rgba(0,240,255,.22), rgba(0,240,255,.06));
  color:#d9faff;
  font-weight:800;letter-spacing:1.5px;
  font-size:clamp(12px,3.3vw,14px);
  cursor:pointer;
  text-shadow:0 1px 0 rgba(0,0,0,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.4);
  transition:background .18s, box-shadow .18s, transform .12s;
  font-family:inherit;touch-action:manipulation;
}
.btn:hover{background:linear-gradient(180deg, rgba(0,240,255,.35), rgba(0,240,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 4px 20px rgba(0,240,255,.35);}
.btn:active{transform:scale(.97);}
.btn.ghost{
  color:#fff0a8;border-color:rgba(255,233,77,.5);
  background:linear-gradient(180deg, rgba(255,233,77,.18), rgba(255,233,77,.04));
}
.btn.ghost:hover{background:linear-gradient(180deg, rgba(255,233,77,.3), rgba(255,233,77,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 20px rgba(255,233,77,.3);}
</style>
</head>
<body>

<header>
  <div class="logo">ШАРИКИ<span>·</span>МЕТКИЙ СТРЕЛОК</div>
  <div class="header-right">
    <div class="chip sound" id="soundBtn" title="Звук">🔊</div>
    <div class="chip lb" id="lbHeaderBtn">🏆 ЛИДЕРЫ</div>
    <div class="chip user" id="userChip">ИГРОК</div>
    <div class="chip menu" id="menuBtn">◀ МЕНЮ</div>
  </div>
</header>

<main>
  <div class="hud">
    <div class="stat"><span class="k">СЧЁТ</span><span class="v" id="scoreVal">0</span></div>
    <div class="stat"><span class="k">РЕКОРД</span><span class="v yellow" id="bestVal">0</span></div>
    <div class="stat"><span class="k">МИР</span><span class="v magenta" id="worldVal">—</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hint" id="hint">Тяни — прицелься · Отпусти — выстрел</div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="ovTitle">ИГРА ОКОНЧЕНА</h2>
        <p id="ovText">СЧЁТ: <b>0</b></p>
        <button class="btn" id="ovRestart">ИГРАТЬ СНОВА</button>
        <button class="btn ghost" id="ovLb">🏆 ЛИДЕРЫ</button>
      </div>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const GAME_ID = 'neon_bubble_shooter';

  /* ============================ DOM ============================ */
  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d');
  const stage    = document.getElementById('stage');
  const scoreEl  = document.getElementById('scoreVal');
  const bestEl   = document.getElementById('bestVal');
  const worldEl  = document.getElementById('worldVal');
  const overlay  = document.getElementById('overlay');
  const ovText   = document.getElementById('ovText');
  const hintEl   = document.getElementById('hint');
  const userChip = document.getElementById('userChip');
  const soundBtn = document.getElementById('soundBtn');

  /* ======================= PLATFORM API ======================== */
  const currentPlayer = (typeof Auth !== 'undefined' && Auth && Auth.get) ? Auth.get() : null;

  if (userChip) userChip.textContent = currentPlayer ? `👤 ${currentPlayer}` : 'ГОСТЬ';

  document.getElementById('lbHeaderBtn')?.addEventListener('click', () => {
    if (typeof LeaderboardUI !== 'undefined' && LeaderboardUI.open) LeaderboardUI.open(GAME_ID);
  });
  document.getElementById('menuBtn')?.addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  let bestScore = 0;

  async function loadStats() {
    try {
      const [myBest, globalRec] = await Promise.all([
        Leaderboard.getPlayerBest(GAME_ID, currentPlayer),
        Leaderboard.getGlobalRecord(GAME_ID)
      ]);
      if (typeof myBest === 'number') bestScore = myBest;
      if (bestEl) bestEl.textContent = Math.max(bestScore, score);
      if (globalRec && typeof globalRec.score === 'number' && worldEl) {
        worldEl.textContent = globalRec.score;
      }
    } catch (err) { /* тихо */ }
  }

  async function submitScore(finalScore) {
    if (currentPlayer && finalScore > 0 && typeof Leaderboard !== 'undefined') {
      try {
        await Leaderboard.submit(GAME_ID, currentPlayer, finalScore);
        await loadStats();
      } catch (err) { /* тихо */ }
    }
  }

  /* ==========================================================
     SOUND  —  приятные синтезированные звуки через Web Audio
     ========================================================== */
  const Sound = {
    ac: null,
    master: null,
    muted: false,

    init() {
      if (this.ac) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.32;
        this.master.connect(this.ac.destination);
      } catch (e) { this.ac = null; }
    },

    unlock() {
      this.init();
      if (this.ac && this.ac.state === 'suspended') {
        this.ac.resume().catch(() => {});
      }
    },

    tone(freq, dur, opts = {}) {
      if (this.muted || !this.ac) return;
      try {
        const t = this.ac.currentTime;
        const o = this.ac.createOscillator();
        const g = this.ac.createGain();
        o.type = opts.type || 'sine';
        o.frequency.setValueAtTime(freq, t);
        if (opts.slideTo) {
          o.frequency.exponentialRampToValueAtTime(Math.max(24, opts.slideTo), t + dur);
        }
        const vol = opts.vol !== undefined ? opts.vol : 0.25;
        const attack = opts.attack || 0.008;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(this.master);
        o.start(t);
        o.stop(t + dur + 0.03);
      } catch (e) {}
    },

    // мягкий «пшик» при выстреле
    shoot() {
      this.tone(760, 0.10, { type: 'sine', slideTo: 280, vol: 0.20 });
      this.tone(1500, 0.06, { type: 'triangle', slideTo: 700, vol: 0.07 });
    },

    // отражение от стенки — лёгкий «тик»
    wall() {
      this.tone(1400, 0.045, { type: 'sine', vol: 0.10 });
    },

    // лопание пузырей — приятная пентатоника в зависимости от комбо
    pop(index) {
      const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
      const n = notes[Math.min(index, notes.length - 1)];
      this.tone(n,     0.20, { type: 'triangle', vol: 0.22 });
      this.tone(n * 2, 0.13, { type: 'sine',     vol: 0.10 });
      // лёгкий «стеклянный» призвук
      this.tone(n * 4, 0.09, { type: 'sine',     vol: 0.04 });
    },

    // падение «оторванных» пузырей — мягкое нисходящее глиссандо
    fall() {
      this.tone(900, 0.32, { type: 'sine', slideTo: 320, vol: 0.13 });
    },

    // новая строка — низкий предупредительный тон
    addRow() {
      this.tone(220, 0.30, { type: 'sine',     vol: 0.16 });
      this.tone(330, 0.30, { type: 'triangle', vol: 0.09, attack: 0.05 });
    },

    // очистка поля — восходящее арпеджио
    clear() {
      const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      arp.forEach((f, i) => {
        setTimeout(() => this.tone(f, 0.22, { type: 'triangle', vol: 0.22 }), i * 70);
      });
    },

    // конец игры — мягко-грустный нисходящий аккорд
    over() {
      const seq = [523.25, 466.16, 392.00, 311.13];
      seq.forEach((f, i) => {
        setTimeout(() => this.tone(f, 0.42, { type: 'triangle', vol: 0.20 }), i * 130);
      });
    },

    // лёгкий звук приземления шара
    place() {
      this.tone(440, 0.06, { type: 'sine', slideTo: 620, vol: 0.10 });
    }
  };

  // загрузка сохранённой настройки звука
  try {
    const saved = localStorage.getItem('neonArcadeMuted');
    if (saved === '1') Sound.muted = true;
  } catch (e) {}

  function updateSoundBtn() {
    if (!soundBtn) return;
    if (Sound.muted) {
      soundBtn.textContent = '🔇';
      soundBtn.classList.add('off');
      soundBtn.title = 'Включить звук';
    } else {
      soundBtn.textContent = '🔊';
      soundBtn.classList.remove('off');
      soundBtn.title = 'Отключить звук';
    }
  }
  updateSoundBtn();

  soundBtn?.addEventListener('click', () => {
    Sound.muted = !Sound.muted;
    try { localStorage.setItem('neonArcadeMuted', Sound.muted ? '1' : '0'); } catch (e) {}
    updateSoundBtn();
    if (!Sound.muted) {
      Sound.unlock();
      Sound.pop(2);
    }
  });

  // разблокировка AudioContext по первому касанию/клику
  function unlockAudio() {
    Sound.unlock();
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
    window.removeEventListener('touchstart', unlockAudio);
  }
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);

/* ========================== CONFIG =========================== */
const COLS = 10;

const COLORS = ['#00f0ff', '#ff00d4', '#a855ff', '#ffe94d', '#00ff88', '#ff3355'];

  const MAX_AIM = 1.32;
  const ROWS_START = 5;
  const SHOTS_PER_ROW = 7;

  /* ========================== STATE ============================ */
  let W = 360, H = 560;
  let R = 18, rowH = 31, gridLeft = 0, gridWidth = 360;
  let shooterY = 500, deathY = 460;

  let topParity = 0;
  let grid = [];

  let bullets = [];
  let falling = [];
  let particles = [];
  let shines = [];      // блики на только что вставленных шарах
  let sparkles = [];    // звёздочки-искры при лопании
  let glints = [];      // случайные блики на поле

  let aim = 0;
  let score = 0;
  let combo = 0;
  let shotsLeft = SHOTS_PER_ROW;
  let state = 'ready';
  let currentColor = 0;
  let nextColor = 0;
  let dragging = false;
  let lastTime = performance.now();
  let globalTime = 0;

  /* ========================= LAYOUT ============================ */
  function layout() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(240, Math.round(rect.width));
    H = Math.max(320, Math.round(rect.height));

    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = Math.min(W / (COLS * 2), H / 27);
    rowH = R * Math.sqrt(3);
    gridWidth = COLS * 2 * R;
    gridLeft = (W - gridWidth) / 2;
    shooterY = H - R * 2.4;
    deathY = shooterY - R * 1.9;
  }


/* ========================= СПРАЙТЫ/ОТРИСОВКА ================= */
function darken(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255;
  let g = (n >> 8) & 255;
  let b = n & 255;
  r = Math.max(0, Math.round(r * (1 - amount)));
  g = Math.max(0, Math.round(g * (1 - amount)));
  b = Math.max(0, Math.round(b * (1 - amount)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawBall(x, y, rad, color) {
  if (rad <= 0.4) return;
  ctx.save();

  // мягкое свечение
  ctx.shadowColor = color;
  ctx.shadowBlur  = rad * 0.45;

  const g = ctx.createRadialGradient(
    x - rad * 0.35, y - rad * 0.38, rad * 0.06,
    x, y, rad * 1.05
  );
  g.addColorStop(0,    '#f2ffff');
  g.addColorStop(0.28, color);
  g.addColorStop(1,    darken(color, 0.55));

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(1, rad * 0.08);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x - rad * 0.30, y - rad * 0.34, rad * 0.19, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();

  ctx.restore();
}

  /* ====================== GRID GEOMETRY ======================== */
  function rowPar(r) { return (topParity + r) & 1; }
  function colsInRow(r) { return rowPar(r) === 0 ? COLS : COLS - 1; }
  function cellX(r, c) { return gridLeft + R + c * 2 * R + (rowPar(r) ? R : 0); }
  function cellY(r) { return R + r * rowH; }

  function neighborList(r, c) {
    const par = rowPar(r);
    const raw = par === 1
      ? [[r, c - 1], [r, c + 1], [r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]]
      : [[r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]];
    const out = [];
    for (let i = 0; i < raw.length; i++) {
      const rr = raw[i][0], cc = raw[i][1];
      if (rr < 0 || cc < 0) continue;
      if (cc >= colsInRow(rr)) continue;
      out.push([rr, cc]);
    }
    return out;
  }

  function occupied(r, c) {
    const row = grid[r];
    if (!row) return false;
    const v = row[c];
    return v !== null && v !== undefined;
  }

  function ensureRow(r) {
    while (grid.length <= r) {
      grid.push(new Array(colsInRow(grid.length)).fill(null));
    }
  }

  function randColor() { return (Math.random() * COLORS.length) | 0; }

  function randColorAvoid(a, b) {
    let c = randColor(), guard = 0;
    while (guard++ < 24 && c === a && c === b) c = randColor();
    return c;
  }

  /* ========================= GAME SETUP ======================== */
  function resetGrid() {
    grid = [];
    topParity = 0;
    for (let r = 0; r < ROWS_START; r++) {
      const n = colsInRow(r);
      const row = new Array(n);
      for (let c = 0; c < n; c++) row[c] = randColorAvoid(row[c - 1], row[c - 2]);
      grid.push(row);
    }
  }

  function reset() {
    score = 0;
    combo = 0;
    shotsLeft = SHOTS_PER_ROW;
    bullets = [];
    falling = [];
    particles = [];
    shines = [];
    sparkles = [];
    glints = [];
    aim = 0;
    state = 'ready';
    overlay.classList.remove('show');
    resetGrid();
    currentColor = randColor();
    nextColor = randColor();
    updateHUD();
    if (hintEl) {
      hintEl.classList.remove('hide');
      clearTimeout(reset._hintT);
      reset._hintT = setTimeout(() => hintEl.classList.add('hide'), 4200);
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = score;
    if (bestEl) bestEl.textContent = Math.max(bestScore, score);
  }

  /* ========================== SHOOTING ========================= */
  function muzzlePos() {
    return {
      x: W / 2 + Math.sin(aim) * R * 1.9,
      y: shooterY - Math.cos(aim) * R * 1.9
    };
  }

  function shoot() {
    if (state !== 'ready' || bullets.length > 0) return;

    const speed = Math.max(620, R * 48);
    const m = muzzlePos();

    bullets.push({
      x: m.x, y: m.y,
      vx: Math.sin(aim) * speed,
      vy: -Math.cos(aim) * speed,
      color: currentColor,
      lastBounce: 0
    });

    currentColor = nextColor;
    nextColor = randColor();

    Sound.shoot();

    shotsLeft--;
    if (shotsLeft <= 0) {
      shotsLeft = SHOTS_PER_ROW;
      addRow();
    }
  }

  function collides(x, y) {
    const rApprox = Math.floor((y - R) / rowH);
    const r0 = Math.max(0, rApprox - 2);
    const r1 = Math.min(grid.length - 1, rApprox + 2);
    const lim = 2 * R * 0.94;
    const lim2 = lim * lim;
    for (let r = r0; r <= r1; r++) {
      const row = grid[r];
      if (!row) continue;
      const cy = cellY(r);
      for (let c = 0; c < row.length; c++) {
        if (row[c] === null || row[c] === undefined) continue;
        const dx = cellX(r, c) - x;
        const dy = cy - y;
        if (dx * dx + dy * dy < lim2) return true;
      }
    }
    return false;
  }

  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const speed = Math.hypot(b.vx, b.vy) || 1;
      let remaining = speed * dt;
      let ux = b.vx / speed;
      let uy = b.vy / speed;
      const maxStep = Math.max(2, R * 0.3);
      let hit = false;
      let bounced = false;

      while (remaining > 0 && !hit) {
        const step = Math.min(maxStep, remaining);
        remaining -= step;

        b.x += ux * step;
        b.y += uy * step;

        if (b.x - R < gridLeft) { b.x = gridLeft + R; ux = -ux; bounced = true; }
        else if (b.x + R > gridLeft + gridWidth) { b.x = gridLeft + gridWidth - R; ux = -ux; bounced = true; }

        if (b.y - R <= 0) { b.y = R; hit = true; break; }
        if (collides(b.x, b.y)) { hit = true; break; }
      }

      if (bounced) {
        const now = performance.now();
        if (now - b.lastBounce > 90) {
          b.lastBounce = now;
          Sound.wall();
        }
      }

      b.vx = ux * speed;
      b.vy = uy * speed;

      if (hit) {
        placeBullet(b);
        bullets.splice(i, 1);
      } else if (b.y > H + R * 3) {
        bullets.splice(i, 1);
      }
    }
  }

  function isValidCell(r, c) {
    if (r === 0) return true;
    const nb = neighborList(r, c);
    for (let i = 0; i < nb.length; i++) {
      if (occupied(nb[i][0], nb[i][1])) return true;
    }
    return false;
  }

  function placeBullet(b) {
    let best = null, bestD = Infinity;
    const maxRows = grid.length + 2;

    for (let r = 0; r < maxRows; r++) {
      const n = colsInRow(r);
      const cy = cellY(r);
      for (let c = 0; c < n; c++) {
        if (occupied(r, c)) continue;
        if (!isValidCell(r, c)) continue;
        const dx = cellX(r, c) - b.x;
        const dy = cy - b.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = { r, c }; }
      }
    }
    if (!best) return;

    ensureRow(best.r);
    grid[best.r][best.c] = b.color;

    // блик приземления
    shines.push({
      x: cellX(best.r, best.c),
      y: cellY(best.r),
      t: 0,
      life: 0.55
    });

    Sound.place();

    resolve(best.r, best.c);
  }

  /* ======================= MATCH RESOLVE ======================= */
  function findCluster(r0, c0, color) {
    const seen = new Set([r0 + ',' + c0]);
    const stack = [[r0, c0]];
    const out = [];
    while (stack.length) {
      const cur = stack.pop();
      out.push(cur);
      const nb = neighborList(cur[0], cur[1]);
      for (let i = 0; i < nb.length; i++) {
        const rr = nb[i][0], cc = nb[i][1];
        const k = rr + ',' + cc;
        if (seen.has(k)) continue;
        if (!occupied(rr, cc)) continue;
        if (grid[rr][cc] !== color) continue;
        seen.add(k);
        stack.push([rr, cc]);
      }
    }
    return out;
  }

  function findFloating() {
    const reach = new Set();
    const stack = [];
    if (grid[0]) {
      for (let c = 0; c < grid[0].length; c++) {
        if (occupied(0, c)) { reach.add('0,' + c); stack.push([0, c]); }
      }
    }
    while (stack.length) {
      const cur = stack.pop();
      const nb = neighborList(cur[0], cur[1]);
      for (let i = 0; i < nb.length; i++) {
        const rr = nb[i][0], cc = nb[i][1];
        const k = rr + ',' + cc;
        if (reach.has(k)) continue;
        if (!occupied(rr, cc)) continue;
        reach.add(k);
        stack.push([rr, cc]);
      }
    }
    const out = [];
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (occupied(r, c) && !reach.has(r + ',' + c)) out.push([r, c]);
      }
    }
    return out;
  }

    function addPop(x, y, ci) {
	  const col = COLORS[ci];
	  const hi  = COLORS[ci];

    // цветные капли
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.45 + Math.random() * 0.35,
        t: 0,
        c: col,
        r: 1.5 + Math.random() * 2.8
      });
    }

    // звёздочки-искры
    const sparkCount = 5 + (Math.random() * 3 | 0);
    for (let i = 0; i < sparkCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      sparkles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        t: 0,
        life: 0.55 + Math.random() * 0.35,
        size: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 6,
        c: hi
      });
    }

    // кольцевая вспышка
    particles.push({
      ring: true,
      x, y, r0: R * 0.4, r1: R * 1.8,
      t: 0, life: 0.35,
      c: hi
    });
  }

  function countBubbles() {
    let n = 0;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) if (row[c] !== null && row[c] !== undefined) n++;
    }
    return n;
  }

  function resolve(r, c) {
    const color = grid[r][c];
    const cluster = findCluster(r, c, color);

    if (cluster.length >= 3) {
      let gained = 0;

      for (let i = 0; i < cluster.length; i++) {
        const rr = cluster[i][0], cc = cluster[i][1];
        addPop(cellX(rr, cc), cellY(rr), grid[rr][cc]);
        grid[rr][cc] = null;
        gained += 10;
      }

      // приятный звук лопания — нота зависит от комбо
      Sound.pop(combo);

      const floaters = findFloating();
      if (floaters.length) {
        Sound.fall();
      }
      for (let i = 0; i < floaters.length; i++) {
        const rr = floaters[i][0], cc = floaters[i][1];
        const colIdx = grid[rr][cc];
        falling.push({
          x: cellX(rr, cc),
          y: cellY(rr),
          vx: (Math.random() - 0.5) * 90,
          vy: -60 - Math.random() * 90,
          color: colIdx,
          spin: (Math.random() - 0.5) * 6,
          rot: 0
        });
        grid[rr][cc] = null;
        gained += 20;
      }

      combo++;
      const mult = 1 + Math.min(combo - 1, 4) * 0.25;
      score += Math.round(gained * mult);
      updateHUD();

      // очистка поля — бонус и новый набор
      if (countBubbles() === 0) {
        score += 500;
        updateHUD();
        Sound.clear();
        resetGrid();
        return;
      }
    } else {
      combo = 0;
    }

    checkGameOver();
  }

  /* ========================= ROW / OVER ======================== */
  function addRow() {
    topParity = (topParity + 1) & 1;
    const n = colsInRow(0);
    const row = new Array(n);
    for (let c = 0; c < n; c++) row[c] = randColorAvoid(row[c - 1], row[c - 2]);
    grid.unshift(row);
    Sound.addRow();
    checkGameOver();
  }

  function checkGameOver() {
    if (state === 'over') return;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      const cy = cellY(r);
      if (cy - R > deathY) break;
      for (let c = 0; c < row.length; c++) {
        if (row[c] === null || row[c] === undefined) continue;
        if (cy + R >= deathY) { gameOver(); return; }
      }
    }
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    bullets = [];
    if (ovText) ovText.innerHTML = 'СЧЁТ: <b>' + score + '</b>';
    overlay.classList.add('show');
    Sound.over();
    submitScore(score);
  }

  /* ========================== PARTICLES ======================== */
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      if (!p.ring) {
        p.vy += 520 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.t += dt;
      if (s.t >= s.life) { sparkles.splice(i, 1); continue; }
      s.vy += 420 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
    }

    for (let i = shines.length - 1; i >= 0; i--) {
      shines[i].t += dt;
      if (shines[i].t >= shines[i].life) shines.splice(i, 1);
    }

    // случайные блики на поле (искры)
    if (Math.random() < 0.06 && glints.length < 6) {
      const r = (Math.random() * Math.min(grid.length, 6)) | 0;
      const n = colsInRow(r);
      const c = (Math.random() * n) | 0;
      if (occupied(r, c)) {
        glints.push({
          x: cellX(r, c) + (Math.random() - 0.5) * R * 0.7,
          y: cellY(r) + (Math.random() - 0.5) * R * 0.7,
          t: 0, life: 0.9 + Math.random() * 0.5,
          size: 2 + Math.random() * 3
        });
      }
    }
    for (let i = glints.length - 1; i >= 0; i--) {
      glints[i].t += dt;
      if (glints[i].t >= glints[i].life) glints.splice(i, 1);
    }
  }

  function updateFalling(dt) {
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.vy += 1500 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.spin * dt;
      if (f.y > H + R * 3) falling.splice(i, 1);
    }
  }

  /* =========================== UPDATE ========================== */
  function update(dt) {
    globalTime += dt;
    updateBullets(dt);
    updateFalling(dt);
    updateParticles(dt);
  }

  /* =========================== RENDER ========================== */
  function drawBackground() {
    // игровое поле — мягкий градиент
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,   'rgba(140,190,255,0.05)');
    grad.addColorStop(0.5, 'rgba(180,150,255,0.03)');
    grad.addColorStop(1,   'rgba(255,190,220,0.05)');
    ctx.fillStyle = grad;
    ctx.fillRect(gridLeft, 0, gridWidth, H);

    // боковые рейки — мягкое свечение
    ctx.save();
    const sideGradL = ctx.createLinearGradient(gridLeft - 8, 0, gridLeft + 4, 0);
    sideGradL.addColorStop(0, 'rgba(0,0,0,0)');
    sideGradL.addColorStop(1, 'rgba(150,220,255,0.35)');
    ctx.fillStyle = sideGradL;
    ctx.fillRect(gridLeft - 8, 0, 12, H);

    const sideGradR = ctx.createLinearGradient(gridLeft + gridWidth - 4, 0, gridLeft + gridWidth + 8, 0);
    sideGradR.addColorStop(0, 'rgba(150,220,255,0.35)');
    sideGradR.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sideGradR;
    ctx.fillRect(gridLeft + gridWidth - 4, 0, 12, H);
    ctx.restore();

    // тонкие горизонтальные линии
    ctx.strokeStyle = 'rgba(200,230,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 0; y < H; y += rowH * 2) {
      ctx.moveTo(gridLeft, y);
      ctx.lineTo(gridLeft + gridWidth, y);
    }
    ctx.stroke();

    // зона опасности — мягкая
    const dz = ctx.createLinearGradient(0, deathY - R, 0, H);
    dz.addColorStop(0, 'rgba(255,80,110,0)');
    dz.addColorStop(1, 'rgba(255,80,110,0.14)');
    ctx.fillStyle = dz;
    ctx.fillRect(gridLeft, deathY - R, gridWidth, H - deathY + R);
  }

  function drawDeathLine() {
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -((globalTime * 18) % 18);
    ctx.strokeStyle = 'rgba(255,90,120,0.55)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(gridLeft, deathY);
    ctx.lineTo(gridLeft + gridWidth, deathY);
    ctx.stroke();
    ctx.restore();
  }

  function traceAim() {
    const pts = [];
    const m = muzzlePos();
    let x = m.x, y = m.y;
    let ux = Math.sin(aim), uy = -Math.cos(aim);
    pts.push([x, y]);

    const step = Math.max(4, R * 0.5);
    const lim2 = (R * 1.86) * (R * 1.86);

    for (let i = 0; i < 300; i++) {
      x += ux * step;
      y += uy * step;

      if (x < gridLeft + R) { x = gridLeft + R; ux = -ux; pts.push([x, y]); }
      else if (x > gridLeft + gridWidth - R) { x = gridLeft + gridWidth - R; ux = -ux; pts.push([x, y]); }

      if (y <= R) break;

      let hit = false;
      const rApprox = Math.floor((y - R) / rowH);
      const r0 = Math.max(0, rApprox - 2);
      const r1 = Math.min(grid.length - 1, rApprox + 2);
      for (let r = r0; r <= r1 && !hit; r++) {
        const row = grid[r];
        if (!row) continue;
        const cy = cellY(r);
        for (let c = 0; c < row.length; c++) {
          if (row[c] === null || row[c] === undefined) continue;
          const dx = cellX(r, c) - x;
          const dy = cy - y;
          if (dx * dx + dy * dy < lim2) { hit = true; break; }
        }
      }
      if (hit) break;
      if (y > H) break;
    }
    pts.push([x, y]);
    return pts;
  }

  function drawAim() {
    if (state !== 'ready' || bullets.length > 0) return;
    const pts = traceAim();
    if (pts.length < 2) return;

    ctx.save();
    ctx.setLineDash([6, 8]);
    ctx.lineDashOffset = -((globalTime * 22) % 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = Math.max(1.2, R * 0.08);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();

    // прицел на конце
    const last = pts[pts.length - 1];
    const t = globalTime * 3;
    const rp = 0.85 + Math.sin(t) * 0.08;
    ctx.save();
    ctx.beginPath();
    ctx.arc(last[0], last[1], R * rp, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(last[0], last[1], R * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.restore();
  }

  function drawShines() {
    for (let i = 0; i < shines.length; i++) {
      const sh = shines[i];
      const p = sh.t / sh.life;
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.94, 0, Math.PI * 2);
      ctx.clip();
      ctx.rotate(-Math.PI * 0.75);
      const offset = -R * 1.4 + p * R * 3.2;
      const grad = ctx.createLinearGradient(offset - R * 0.35, 0, offset + R * 0.35, 0);
      grad.addColorStop(0,   'rgba(255,255,255,0)');
      grad.addColorStop(0.5, 'rgba(255,255,255,' + ((1 - p) * 0.85).toFixed(3) + ')');
      grad.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(-R * 2, -R * 2, R * 4, R * 4);
      ctx.restore();
    }
  }
  
  function drawBubble(x, y, ci, alpha) {
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  drawBall(x, y, R, COLORS[ci]);
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = 1;
  }

  function drawShooter() {
    const sx = W / 2, sy = shooterY;

    // мягкое свечение базы (не неон — тёплый свет)
    ctx.save();
    const g = ctx.createRadialGradient(sx, sy, R * 0.15, sx, sy, R * 1.35);
    g.addColorStop(0, 'rgba(200,235,255,0.28)');
    g.addColorStop(1, 'rgba(200,235,255,0)');
    ctx.beginPath();
    ctx.arc(sx, sy, R * 1.35, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    // база — металлический диск
    ctx.save();
    const bg = ctx.createRadialGradient(sx - R * 0.3, sy - R * 0.35, R * 0.1, sx, sy, R * 1.1);
    bg.addColorStop(0, 'rgba(220,240,255,0.55)');
    bg.addColorStop(0.5, 'rgba(90,130,180,0.4)');
    bg.addColorStop(1, 'rgba(20,30,60,0.6)');
    ctx.beginPath();
    ctx.arc(sx, sy, R * 1.05, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // ствол — металлический градиент
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(aim);
    const barrelGrad = ctx.createLinearGradient(-R * 0.4, 0, R * 0.4, 0);
    barrelGrad.addColorStop(0, 'rgba(60,90,130,0.9)');
    barrelGrad.addColorStop(0.5, 'rgba(220,240,255,0.95)');
    barrelGrad.addColorStop(1, 'rgba(60,90,130,0.9)');
    ctx.beginPath();
    ctx.moveTo(-R * 0.44, 0);
    ctx.lineTo(-R * 0.26, -R * 2.3);
    ctx.lineTo(R * 0.26, -R * 2.3);
    ctx.lineTo(R * 0.44, 0);
    ctx.closePath();
    ctx.fillStyle = barrelGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // блик на стволе
    ctx.beginPath();
    ctx.moveTo(-R * 0.1, 0);
    ctx.lineTo(-R * 0.05, -R * 2.1);
    ctx.lineTo(R * 0.05, -R * 2.1);
    ctx.lineTo(R * 0.1, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
    ctx.restore();

    // текущий шар
    if (state === 'ready' && bullets.length === 0) {
      const m = muzzlePos();
      drawBubble(m.x, m.y, currentColor);
    }

    // следующий шар
    const nx = W - R * 2.1;
    const ny = shooterY + R * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.arc(nx, ny, R * 1.2, 0, Math.PI * 2);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
    drawBubble(nx, ny, nextColor, 0.92);
  }

  function drawSparkles() {
    for (let i = 0; i < sparkles.length; i++) {
      const s = sparkles[i];
      const a = 1 - s.t / s.life;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      const sz = s.size;
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(0, sz);
      ctx.moveTo(-sz, 0); ctx.lineTo(sz, 0);
      ctx.stroke();
      // маленькое ядро
      ctx.beginPath();
      ctx.arc(0, 0, sz * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = s.c;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawGlints() {
    for (let i = 0; i < glints.length; i++) {
      const g = glints[i];
      const p = g.t / g.life;
      const a = Math.sin(p * Math.PI) * 0.9;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(g.x, g.y);
      ctx.rotate(p * 2);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';
      const s = g.size;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(0, s);
      ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const a = 1 - p.t / p.life;
      if (p.ring) {
        const rr = p.r0 + (p.r1 - p.r0) * (p.t / p.life);
        ctx.globalAlpha = a * 0.7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
        ctx.strokeStyle = p.c;
        ctx.lineWidth = 2.5 * a;
        ctx.stroke();
      } else {
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.8), 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    // мягкое затемнение по краям сцены
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawDeathLine();
    drawAim();

    // сетка
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      const cy = cellY(r);
      if (cy - R > H + R * 3) break;
      for (let c = 0; c < row.length; c++) {
        const v = row[c];
        if (v === null || v === undefined) continue;
        drawBubble(cellX(r, c), cy, v);
      }
    }

    // блики приземления (поверх шаров)
    drawShines();

    // падающие
    for (let i = 0; i < falling.length; i++) {
      const f = falling[i];
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      drawBubble(0, 0, f.color, 0.9);
      ctx.restore();
    }

    // летящие
    for (let i = 0; i < bullets.length; i++) {
      drawBubble(bullets[i].x, bullets[i].y, bullets[i].color);
    }

    drawParticles();
    drawSparkles();
    drawGlints();
    drawShooter();
    drawVignette();
  }

  /* =========================== INPUT =========================== */
  function pointerAim(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const dx = px - W / 2;
    const dy = shooterY - py;
    let a = Math.atan2(dx, Math.max(dy, 1));
    if (a > MAX_AIM) a = MAX_AIM;
    if (a < -MAX_AIM) a = -MAX_AIM;
    aim = a;
  }

  canvas.addEventListener('pointerdown', (e) => {
    Sound.unlock();
    if (state !== 'ready') return;
    e.preventDefault();
    pointerAim(e);
    dragging = true;
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (state !== 'ready') return;
    if (dragging || e.pointerType === 'mouse') pointerAim(e);
  }, { passive: true });

  canvas.addEventListener('pointerup', (e) => {
    if (state !== 'ready') { dragging = false; return; }
    if (dragging) {
      dragging = false;
      pointerAim(e);
      shoot();
    }
  }, { passive: true });

  canvas.addEventListener('pointercancel', () => { dragging = false; });

  // Клавиатура
  const keys = Object.create(null);

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'spacebar' || k === 'enter') {
      e.preventDefault();
      Sound.unlock();
      shoot();
      return;
    }
    if (k === 'escape') {
      window.location.href = 'index.html';
      return;
    }
    if (k === 'arrowleft' || k === 'a' || k === 'arrowright' || k === 'd' ||
        k === 'arrowup' || k === 'w' || k === 'arrowdown' || k === 's') {
      keys[k] = true;
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function handleKeys(dt) {
    if (state !== 'ready') return;
    const left  = keys['arrowleft'] || keys['a'];
    const right = keys['arrowright'] || keys['d'];
    if (left && !right)  aim = Math.max(-MAX_AIM, aim - 1.9 * dt);
    if (right && !left)  aim = Math.min(MAX_AIM, aim + 1.9 * dt);
  }

  /* ========================== GAME LOOP ======================== */
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    globalTime += dt;
    handleKeys(dt);
    if (state === 'ready') update(dt);
    else { updateFalling(dt); updateParticles(dt); }
    render();
    requestAnimationFrame(loop);
  }

  /* =========================== INIT ============================ */
  document.getElementById('ovRestart')?.addEventListener('click', reset);
  document.getElementById('ovLb')?.addEventListener('click', () => {
    if (typeof LeaderboardUI !== 'undefined' && LeaderboardUI.open) LeaderboardUI.open(GAME_ID);
  });

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 160));

  layout();
  reset();
  loadStats();
  lastTime = performance.now();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
