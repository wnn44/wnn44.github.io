<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ARCADE — Игровая платформа</title>

<!-- Подключение модулей -->
<link rel="stylesheet" href="common.css">
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>
<script src="leaderboard-ui.js"></script>
<script src="games.js"></script>

<style>
  :root {
    --bg: #05060f;
    --bg2: #0b0d1f;
    --accent: #00f0ff;
    --accent2: #ff00d4;
    --text: #e6f7ff;
    --muted: #8ab;
    --danger: #ff3355;
    --success: #00ff88;
    --yellow: #ffd23f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 75%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }
  body {
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(0,240,255,0.2);
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: 6px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(0,240,255,0.4));
  }
  
  /* Блок профиля / никнейма в шапке */
  .profile-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(11, 13, 31, 0.7);
    border: 1px solid rgba(0,240,255,0.25);
    padding: 6px 12px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,240,255,0.08);
  }
  .profile-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .profile-name {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(0,240,255,0.5);
  }
  .btn-sm {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(136, 170, 187, 0.4);
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .btn-sm:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .nickname-form {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nickname-input {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(0,240,255,0.3);
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 6px;
    outline: none;
    width: 140px;
    transition: border-color 0.2s;
  }
  .nickname-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(0,240,255,0.3);
  }
  .btn-save {
    background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(255,0,212,0.2));
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn-save:hover {
    background: var(--accent);
    color: #000;
  }

  main {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
  }

  .hero {
    text-align: center;
    margin-bottom: 40px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 46px);
    letter-spacing: 8px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    color: var(--muted);
    letter-spacing: 2px;
    font-size: 13px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Сетка игр */
  .games-section-title {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .games-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,240,255,0.3), transparent);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px;
  }

  /* Карточка игры */
  .game-card {
    background: linear-gradient(180deg, rgba(11,13,31,0.92), rgba(5,6,15,0.96));
    border: 1px solid rgba(0,240,255,0.25);
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
    z-index: 1;
  }
  
  /* Неоновый переливающийся луч/контур карточки при ховере */
  .game-card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 19px;
    background: linear-gradient(135deg, #7928ca, #000000, #7928ca);
    background-size: 300% 300%;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .game-card:hover {
    transform: translateY(-8px);
    border-color: transparent;
    box-shadow: 0 15px 40px -10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 102, 255, 0.3);
  }

  .game-card:hover::before {
    opacity: 1;
    animation: cardGlowFlow 3s ease infinite;
  }

  /* Медиа превью */
  .game-media {
    position: relative;
    width: 100%;
    height: 180px;
    border-radius: 12px;
    overflow: hidden;
    background: #02030a;
    border: 1px solid rgba(0,240,255,0.15);
    margin-bottom: 18px;
  }
  .game-media img,
  .game-media video,
  .game-media canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease, filter 0.4s ease;
  }
  .game-card:hover .game-media img,
  .game-card:hover .game-media video,
  .game-card:hover .game-media canvas {
    transform: scale(1.05);
    filter: brightness(1.1) contrast(1.05);
  }

  .game-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .game-title {
    font-size: 20px;
    letter-spacing: 2px;
    font-weight: 800;
    color: var(--text);
    transition: all 0.3s ease;
  }
  
  /* Переливающийся заголовок при наведении на карточку */
  .game-card:hover .game-title {
    background: linear-gradient(90deg, #00f0ff, #ff00d4, #ffe94d, #00f0ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textShimmer 2s linear infinite;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
  }
  .game-tags {
    display: flex;
    gap: 6px;
  }
  .tag {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0,240,255,0.1);
    color: var(--accent);
    border: 1px solid rgba(0,240,255,0.2);
  }

  .game-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 20px;
    flex: 1;
  }

  /* Блок статов на карточке */
  .game-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: rgba(0,0,0,0.3);
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 18px;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-val.rank {
    color: var(--yellow);
  }
  .stat-val.world {
    color: var(--accent2);
  }

  /* Действия на карточке */
  .game-actions {
    display: flex;
    gap: 12px;
    align-items: stretch;
    margin-top: 4px;
  }
  
  /* Крупная, заметная неоновая кнопка Играть */
  .play-btn {
    flex: 2.2;
    padding: 13px 18px;
    background: linear-gradient(135deg, #00f0ff 0%, #0099ff 100%);
    color: #05060f;
    border: none;
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 900;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .play-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.5s ease;
  }
  .play-btn:hover {
    background: linear-gradient(135deg, #00f0ff 0%, #ff00d4 100%);
    color: #ffffff;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 50px rgba(255, 0, 212, 0.5);
    transform: translateY(-2px) scale(1.03);
  }
  .play-btn:hover::before {
    left: 100%;
  }
  .play-btn:active {
    transform: translateY(1px) scale(0.98);
  }

  .lb-btn {
    flex: 1;
    padding: 13px 10px;
    background: rgba(255, 210, 63, 0.08);
    color: var(--yellow);
    border: 1.5px solid rgba(255, 210, 63, 0.35);
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 800;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }
  .lb-btn:hover {
    background: rgba(255, 210, 63, 0.25);
    border-color: var(--yellow);
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 210, 63, 0.4);
    transform: translateY(-2px);
  }

  /* Анимации переливания для заголовка и рамки при ховере */
  @keyframes textShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes cardGlowFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  footer {
    text-align: center;
    margin-top: 60px;
    color: #456;
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* ===== КРАСОЧНОЕ ОКНО АВТОРИЗАЦИИ / ВЫБОРА ИГРОКА ===== */
  .auth-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 5, 14, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 16px;
  }
  .auth-modal.open {
    opacity: 1;
    pointer-events: auto;
  }
  .auth-card {
    background: linear-gradient(180deg, rgba(16, 20, 48, 0.98), rgba(7, 10, 24, 0.99));
    border: 1px solid rgba(0, 240, 255, 0.45);
    border-radius: 22px;
    padding: 32px 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 
      0 0 50px rgba(0, 240, 255, 0.25),
      0 0 90px rgba(255, 0, 212, 0.18),
      0 30px 80px rgba(0, 0, 0, 0.9);
    position: relative;
    overflow: hidden;
    transform: scale(0.92);
    transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  .auth-modal.open .auth-card {
    transform: scale(1);
  }
  
  /* Верхний неоновый блик карточки */
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #00f0ff, #ff00d4, #00f0ff);
    background-size: 200% auto;
    animation: textShimmer 3s linear infinite;
  }

  .auth-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    background: rgba(0, 240, 255, 0.1);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    margin-bottom: 12px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .auth-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #00f0ff, #ff00d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
  }
  .auth-subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    line-height: 1.4;
  }

  /* Раздел 1: Список существующих игроков */
  .auth-section-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--yellow);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .player-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 140px;
    overflow-y: auto;
    margin-bottom: 18px;
    padding-right: 4px;
  }
  .player-chip {
    background: rgba(13, 17, 40, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .player-chip:hover {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 212, 0.2));
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }
  .player-chip.active {
    border-color: var(--success);
    background: rgba(0, 255, 136, 0.15);
    color: var(--success);
  }
  .player-empty {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    padding: 6px 0;
  }

  /* Разделитель */
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: rgba(136, 170, 187, 0.5);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .auth-divider::before,
  .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.2), transparent);
  }
  .auth-divider::before {
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2));
  }

  /* Форма ввода нового игрока */
  .auth-new-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .auth-input-wrap {
    position: relative;
    width: 100%;
  }
  .auth-input-wrap input {
    width: 100%;
    background: rgba(5, 7, 20, 0.85);
    border: 1.5px solid rgba(0, 240, 255, 0.35);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px;
    color: #fff;
    font-weight: 600;
    letter-spacing: 1.5px;
    outline: none;
    transition: all 0.2s ease;
  }
  .auth-input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
    background: rgba(7, 10, 28, 0.95);
  }
  .auth-input-wrap input::placeholder {
    color: rgba(136, 170, 187, 0.5);
    font-weight: 400;
  }

  .auth-btn-submit {
    padding: 13px;
    background: linear-gradient(135deg, #00f0ff 0%, #ff00d4 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .auth-btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 35px rgba(0, 240, 255, 0.8), 0 0 50px rgba(255, 0, 212, 0.5);
  }

  .auth-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .auth-skip-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    text-decoration: underline;
    transition: color 0.2s;
  }
  .auth-skip-btn:hover {
    color: #fff;
  }
  .auth-close-btn {
    position: absolute;
    top: 16px;
    right: 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }
  .auth-close-btn:hover {
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="logo">NEON ARCADE</div>
  
  <div class="profile-box" id="profile-box">
    <!-- Генерируется из JS -->
  </div>
</header>

<main>
  <section class="hero">
    <h1>ИГРОВАЯ ПЛАТФОРМА</h1>
    <p>Выберите аркаду и устaновите новый неоновый рекорд в таблице лидеров</p>
  </section>

  <section>
    <div class="games-section-title">Каталог игр</div>
    <div class="games-grid" id="games-grid">
      <!-- Генерируется из GAMES в games.js -->
    </div>
  </section>
</main>

<!-- Красочное окно авторизации / выбора игрока -->
<div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true">
  <div class="auth-card">
    <button class="auth-close-btn" id="auth-close-btn" title="Закрыть">✕</button>
    <div class="auth-badge">🎮 NEON ARCADE PROFILE</div>
    <div class="auth-title">КТО ИГРАЕТ?</div>
    <div class="auth-subtitle">Выберите ваш профиль для таблицы лидеров или введите новое имя:</div>

    <div class="auth-section-label">⚡ Выберите игрока:</div>
    <div class="player-list" id="modal-player-list">
      <!-- Генерируется из JS -->
    </div>

    <div class="auth-divider">или введите новое имя</div>

    <form class="auth-new-form" id="modal-auth-form">
      <div class="auth-input-wrap">
        <input type="text" id="modal-nickname-input" placeholder="Новый никнейм..." maxlength="20" autocomplete="off" required>
      </div>
      <button type="submit" class="auth-btn-submit">
        <span>▶ ВОЙТИ В АРКАДУ</span>
      </button>
    </form>

    <div class="auth-footer">
      <span style="font-size:11px; color:#5c6594;">2-20 символов (a-z, 0-9, _, -)</span>
      <button type="button" class="auth-skip-btn" id="auth-skip-btn">Продолжить как Гость</button>
    </div>
  </div>
</div>

<footer>© NEON ARCADE</footer>

<script>
'use strict';

document.addEventListener('DOMContentLoaded', () => {
  const profileBox = document.getElementById('profile-box');
  const gamesGrid = document.getElementById('games-grid');
  const authModal = document.getElementById('auth-modal');
  const modalPlayerList = document.getElementById('modal-player-list');
  const modalAuthForm = document.getElementById('modal-auth-form');
  const modalNickInput = document.getElementById('modal-nickname-input');
  const authCloseBtn = document.getElementById('auth-close-btn');
  const authSkipBtn = document.getElementById('auth-skip-btn');

  // Управление красочным окном авторизации
  function openAuthModal() {
    renderPlayerList();
    authModal.classList.add('open');
    setTimeout(() => modalNickInput && modalNickInput.focus(), 150);
  }

  function closeAuthModal() {
    authModal.classList.remove('open');
  }

  function selectPlayer(name) {
    if (Auth.set(name)) {
      closeAuthModal();
      renderProfile();
      loadAllStatsBatch(window.GAMES || [], Auth.get());
    }
  }

  function renderPlayerList() {
    modalPlayerList.innerHTML = '';
    const currentName = Auth.get();
    const players = Leaderboard.getAllPlayers();

    if (!players || players.length === 0) {
      modalPlayerList.innerHTML = '<div class="player-empty">Список пуст. Создайте первого игрока ниже!</div>';
      return;
    }

    players.forEach(p => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'player-chip' + (currentName && p.toLowerCase() === currentName.toLowerCase() ? ' active' : '');
      chip.innerHTML = `<span>👤</span> <span>${escapeHtml(p)}</span>`;
      chip.onclick = () => selectPlayer(p);
      modalPlayerList.appendChild(chip);
    });
  }

  modalAuthForm.onsubmit = (e) => {
    e.preventDefault();
    const val = modalNickInput.value;
    if (Auth.set(val)) {
      modalNickInput.value = '';
      closeAuthModal();
      renderProfile();
      loadAllStatsBatch(window.GAMES || [], Auth.get());
    } else {
      alert('Никнейм должен содержать от 2 до 20 символов (латиница, цифры, _, -)');
    }
  };

  authCloseBtn.onclick = closeAuthModal;
  authSkipBtn.onclick = closeAuthModal;
  authModal.onclick = (e) => {
    if (e.target === authModal) closeAuthModal();
  };

  // Отрисовка плашки никнейма в шапке
  function renderProfile() {
    const currentName = Auth.get();
    profileBox.innerHTML = '';

    if (currentName) {
      const info = document.createElement('div');
      info.className = 'profile-info';
      info.innerHTML = `<span>👤 Игрок:</span> <span class="profile-name">${escapeHtml(currentName)}</span>`;
      
      const changeBtn = document.createElement('button');
      changeBtn.className = 'btn-sm';
      changeBtn.textContent = 'Сменить';
      changeBtn.onclick = openAuthModal;

      profileBox.appendChild(info);
      profileBox.appendChild(changeBtn);
    } else {
      const loginBtn = document.createElement('button');
      loginBtn.className = 'btn-save';
      loginBtn.innerHTML = '👤 Выбрать игрока';
      loginBtn.onclick = openAuthModal;
      profileBox.appendChild(loginBtn);
    }
  }

  // Fallback Canvas превью для игр
  function renderFallbackPreview(canvas, gameId) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 320;
    const h = canvas.height = 180;
    
    if (gameId === 'tetris') {
      ctx.fillStyle = '#070a17';
      ctx.fillRect(0, 0, w, h);
      const shapes = [
        { c: '#26d9f2', x: 40, y: 30, s: [[1,1,1,1]] },
        { c: '#b45cff', x: 120, y: 50, s: [[0,1,0],[1,1,1]] },
        { c: '#4dee8a', x: 200, y: 30, s: [[0,1,1],[1,1,0]] },
        { c: '#ffd23f', x: 170, y: 100, s: [[1,1],[1,1]] },
        { c: '#ff5c6a', x: 70, y: 110, s: [[1,1,0],[0,1,1]] }
      ];
      shapes.forEach(sh => {
        ctx.fillStyle = sh.c;
        ctx.shadowColor = sh.c;
        ctx.shadowBlur = 12;
        sh.s.forEach((row, y) => row.forEach((v, x) => {
          if (v) ctx.fillRect(sh.x + x*22, sh.y + y*22, 20, 20);
        }));
      });
    } else if (gameId === '2048') {
      ctx.fillStyle = '#05010d';
      ctx.fillRect(0, 0, w, h);
      const tiles = [
        { c: '#00f0ff', txt: '2', x: 50, y: 30 },
        { c: '#ff2bd6', txt: '16', x: 120, y: 30 },
        { c: '#a855ff', txt: '256', x: 190, y: 30 },
        { c: '#ffe94d', txt: '2048', x: 120, y: 100 }
      ];
      tiles.forEach(t => {
        ctx.fillStyle = t.c;
        ctx.shadowColor = t.c;
        ctx.shadowBlur = 14;
        ctx.fillRect(t.x, t.y, 50, 50);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.txt, t.x + 25, t.y + 25);
      });
    } else {
      ctx.fillStyle = '#0b0d1f';
      ctx.fillRect(0, 0, w, h);
    }
  }

  // Отрисовка карточек игр
  async function renderGames() {
    gamesGrid.innerHTML = '';
    const games = window.GAMES || [];
    const player = Auth.get();

    for (const game of games) {
      const card = document.createElement('div');
      card.className = 'game-card';

      // Блок медиа-превью
      const mediaWrap = document.createElement('div');
      mediaWrap.className = 'game-media';

      if (game.preview && game.preview.src) {
        if (game.preview.type === 'video') {
          const video = document.createElement('video');
          video.src = game.preview.src;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.onerror = () => {
            mediaWrap.innerHTML = '';
            const canvas = document.createElement('canvas');
            mediaWrap.appendChild(canvas);
            renderFallbackPreview(canvas, game.id);
          };
          mediaWrap.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = game.preview.src;
          img.alt = game.title;
          img.onerror = () => {
            // Если картинка не найдена — рисуем Canvas fallback
            mediaWrap.innerHTML = '';
            const canvas = document.createElement('canvas');
            mediaWrap.appendChild(canvas);
            renderFallbackPreview(canvas, game.id);
          };
          mediaWrap.appendChild(img);
        }
      } else {
        const canvas = document.createElement('canvas');
        mediaWrap.appendChild(canvas);
        renderFallbackPreview(canvas, game.id);
      }

      // Название и теги
      const headerRow = document.createElement('div');
      headerRow.className = 'game-header-row';
      headerRow.innerHTML = `
        <div class="game-title">${game.icon || ''} ${escapeHtml(game.title)}</div>
        <div class="game-tags">
          ${(game.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      `;

      // Описание
      const desc = document.createElement('div');
      desc.className = 'game-desc';
      desc.textContent = game.description;

      // Статистика (Рекорд, Ранг в мире, Мировой рекорд)
      const statsBox = document.createElement('div');
      statsBox.className = 'game-stats';
      statsBox.innerHTML = `
        <div class="stat-item">
          <span class="stat-label">Ваш рекорд</span>
          <span class="stat-val" id="best-${game.id}">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Рейтинг</span>
          <span class="stat-val rank" id="rank-${game.id}">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Мировой</span>
          <span class="stat-val world" id="world-${game.id}">—</span>
        </div>
      `;

      // Кнопки
      const actions = document.createElement('div');
      actions.className = 'game-actions';
      
      const playBtn = document.createElement('a');
      playBtn.className = 'play-btn';
      playBtn.href = game.url;
      playBtn.innerHTML = '▶ ИГРАТЬ';

      const lbBtn = document.createElement('button');
      lbBtn.className = 'lb-btn';
      lbBtn.innerHTML = '🏆 Топ';
      lbBtn.onclick = () => LeaderboardUI.open(game.id);

      actions.appendChild(playBtn);
      actions.appendChild(lbBtn);

      card.appendChild(mediaWrap);
      card.appendChild(headerRow);
      card.appendChild(desc);
      card.appendChild(statsBox);
      card.appendChild(actions);

      gamesGrid.appendChild(card);
    }

    // После создания всех карточек загружаем рекорды
    loadAllStatsBatch(games, player);
  }

  function loadAllStatsBatch(games, player) {
    games.forEach(g => {
      const bestEl = document.getElementById(`best-${g.id}`);
      const rankEl = document.getElementById(`rank-${g.id}`);
      const worldEl = document.getElementById(`world-${g.id}`);

      // 1. Мировой рекорд (виден всем)
      const worldRec = Leaderboard.getGlobalRecord(g.id);
      if (worldEl) {
        if (worldRec && worldRec.score > 0) {
          worldEl.textContent = Number(worldRec.score).toLocaleString();
          worldEl.title = `Мировой рекорд: ${worldRec.username} (${Number(worldRec.score).toLocaleString()})`;
        } else {
          worldEl.textContent = '—';
        }
      }

      // 2. Личный рекорд и рейтинг
      if (!player) {
        if (bestEl) bestEl.textContent = '—';
        if (rankEl) rankEl.textContent = '—';
        return;
      }

      const score = Leaderboard.getPlayerBest(g.id, player);
      const rank = Leaderboard.getPlayerRank(g.id, player);

      if (bestEl) bestEl.textContent = score > 0 ? Number(score).toLocaleString() : '—';
      if (rankEl) rankEl.textContent = rank ? `#${rank}` : '—';
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderProfile();
  renderGames();

  // Проверка авторизации: если игрок не авторизован — выскакивает красочное окно!
  if (!Auth.isValid()) {
    setTimeout(openAuthModal, 250);
  }

  // Автоматически обновлять рекорды на карточках и список игроков в модалке, как только данные пришли из сети
  window.addEventListener('leaderboard-updated', () => {
    loadAllStatsBatch(window.GAMES || [], Auth.get());
    if (authModal.classList.contains('open')) {
      renderPlayerList();
    }
  });
});
</script>
